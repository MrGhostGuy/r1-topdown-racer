<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>R1 Drift Racer – Top-Down</title>
<meta name="viewport" content="width=240,height=282,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#0b3a16;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;}
#canvas{display:block;width:240px;height:282px;background:#0b3a16;}
.panel{position:absolute;top:0;left:0;width:240px;height:282px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,rgba(4,20,10,.94),rgba(2,10,6,.97));color:#fff;z-index:20;padding:8px 0;box-sizing:border-box;overflow:hidden;}
.logo{font-size:23px;font-weight:900;letter-spacing:.5px;line-height:1;text-align:center;background:linear-gradient(180deg,#ffe259,#ffa751);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 0 rgba(0,0,0,.25);}
.sub{text-align:center;font-size:9px;color:#9fd8ae;letter-spacing:2px;margin:2px 0 6px;text-transform:uppercase;}
.carChip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:3px 10px 3px 4px;font-size:9px;margin-bottom:6px;}
.carChip .dot{width:16px;height:16px;border-radius:5px;border:2px solid rgba(255,255,255,.7);}
button{font-family:inherit;cursor:pointer;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.09);color:#fff;border-radius:6px;font-size:10px;padding:6px 10px;margin:2px;}
button:active{background:rgba(255,255,255,.25);}
button.big{font-size:13px;font-weight:800;padding:9px 22px;background:linear-gradient(180deg,#ffb300,#ff7b00);border-color:#ffd54f;color:#221100;box-shadow:0 3px 0 #a34d00;border-radius:8px;margin:5px 0 3px;}
button.big:active{transform:translateY(2px);box-shadow:0 1px 0 #a34d00;}
.row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;}
.row button{flex:1;min-width:0;white-space:nowrap;overflow:hidden;padding:6px 3px;}
.lbl{font-size:7px;color:#8fc79b;text-transform:uppercase;letter-spacing:1px;text-align:center;}
.w100{width:216px;}
.statsLine{font-size:8px;color:#cfe8d4;margin-top:5px;text-align:center;line-height:1.5;}
table{border-collapse:collapse;font-size:9px;color:#fff;}
td,th{padding:2px 6px;text-align:left;}
tr.me td{color:#ffd54f;font-weight:700;}
h3{margin:4px 0 4px;font-size:13px;}
.garageGrid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;width:224px;max-height:172px;overflow-y:auto;padding:2px;}
.gcar{width:66px;border-radius:6px;padding:4px 2px;text-align:center;font-size:7px;line-height:1.3;border:2px solid transparent;}
.gcar .sw{height:14px;border-radius:4px;margin-bottom:2px;border:1px solid rgba(255,255,255,.5);}
.gcar.sel{border-color:#ffd54f;background:rgba(255,213,79,.12);}
.gcar.locked{opacity:.32;filter:grayscale(.8);}
.bars{font-size:6px;color:#b9e4c2;text-align:left;margin:1px 3px 0;line-height:1.5;}
#toast{position:absolute;top:120px;left:0;width:240px;text-align:center;font-size:12px;font-weight:800;color:#ffd54f;text-shadow:0 1px 3px #000,0 0 12px rgba(255,180,0,.5);display:none;pointer-events:none;z-index:15;}
#banner{position:absolute;top:56px;left:0;width:240px;text-align:center;font-size:15px;font-weight:900;color:#fff;text-shadow:0 2px 4px #000;display:none;pointer-events:none;z-index:15;}
.hidden{display:none!important;}
.rar-common{color:#cfcfcf}.rar-rare{color:#4db2ff}.rar-epic{color:#d98cff}.rar-legendary{color:#ffd54f}
</style>
</head>
<body>
<canvas id="canvas" width="240" height="282"></canvas>
<div id="banner"></div>
<div id="toast"></div>

<div id="menu" class="panel">
  <div class="logo">R1 DRIFT<br>RACER</div>
  <div class="sub">Top-Down Arcade Racing</div>
  <div class="carChip"><div class="dot" id="carDot"></div><span id="carName">Red Starter</span><span id="carRar" class="rar-common"></span></div>
  <button class="big" id="btnStart">🏁 START RACE</button>
  <div class="row w100">
    <div style="flex:1"><div class="lbl">Mode</div><button class="w100" id="btnMode" style="width:100%">Quick Race</button></div>
    <div style="flex:1"><div class="lbl">Difficulty</div><button id="btnDiff" style="width:100%">Pro</button></div>
  </div>
  <div class="row w100" id="trackRow">
    <div style="flex:1"><div class="lbl">Track</div><button id="btnTrack" style="width:100%">Oval</button></div>
    <div style="flex:1"><div class="lbl">Laps</div><button id="btnLaps" style="width:100%">3 Laps</button></div>
  </div>
  <div class="row w100">
    <button id="btnGarage">🚗 Garage</button>
    <button id="btnChest">🎁 Chest (<span id="chestN">0</span>)</button>
    <button id="btnSound">🔊 Sound</button>
  </div>
  <div class="statsLine" id="statsLine"></div>
  <div class="statsLine" style="color:#7fae8a">Drag = steer &nbsp;•&nbsp; Side button / tap ⚡ = boost<br>Hold a slide to charge a drift boost</div>
</div>

<div id="garage" class="panel hidden">
  <h3>🚗 Garage</h3>
  <div class="garageGrid" id="garageGrid"></div>
  <div class="statsLine" id="garageInfo">Tap a car to equip it</div>
  <button id="btnGarageBack">Back</button>
</div>

<div id="results" class="panel hidden">
  <div class="logo" style="font-size:19px" id="resTitle">FINISH</div>
  <div class="sub" id="resSub"></div>
  <div id="resTable"></div>
  <div class="statsLine" id="resReward"></div>
  <button class="big" id="btnNext">Race Again</button>
  <div class="row">
    <button id="btnResMenu">Menu</button>
    <button id="btnResGarage">🚗 Garage</button>
  </div>
</div>

<div id="pauseMenu" class="panel hidden" style="justify-content:center">
  <h3>Paused</h3>
  <button class="big" id="btnResume">Resume</button>
  <button id="btnRestart">Restart Race</button>
  <button id="btnQuit">Quit to Menu</button>
</div>

<script>
(function(){
'use strict';
const W=240,H=282;
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
function fmt(t){ if(!isFinite(t)) return '--:--.--'; const m=Math.floor(t/60), s=t-m*60; return (m>0? m+':' : '') + (s<10&&m>0?'0':'') + s.toFixed(2); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- persistent data ---------- */
function loadJSON(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
let bestTimes=loadJSON('r1racer_bestTimes',{});
let bestLaps=loadJSON('r1racer_bestLaps',{});
let ghosts=loadJSON('r1racer_ghosts',{});
let stats=loadJSON('r1racer_stats',{races:0,wins:0,podiums:0});
let coins=loadJSON('r1racer_coins',0);
let chests=loadJSON('r1racer_chests', null);
if(chests===null){ chests=parseInt(localStorage.getItem('chestCount')||'0',10)||0; }
let ownedCars=loadJSON('ownedCars',[]);
if(!ownedCars.length) ownedCars=['Red Starter'];
let selectedCar=localStorage.getItem('selectedCar')||'Blue Bolt';
if(ownedCars.indexOf(selectedCar)<0) selectedCar=ownedCars[0];
let soundOn=loadJSON('r1racer_sound',true);

/* ---------- audio ---------- */
let AC=null, engOsc=null, engGain=null, engFilter=null, noiseGain=null;
function audioInit(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    engOsc=AC.createOscillator(); engOsc.type='sawtooth'; engOsc.frequency.value=55;
    engFilter=AC.createBiquadFilter(); engFilter.type='lowpass'; engFilter.frequency.value=420; engFilter.Q.value=2;
    engGain=AC.createGain(); engGain.gain.value=0;
    engOsc.connect(engFilter); engFilter.connect(engGain); engGain.connect(AC.destination); engOsc.start();
    const len=AC.sampleRate*1, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    const nf=AC.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=900;
    noiseGain=AC.createGain(); noiseGain.gain.value=0;
    src.connect(nf); nf.connect(noiseGain); noiseGain.connect(AC.destination); src.start();
  }catch(e){ AC=null; }
}
function beep(f,dur,g,type,when){
  if(!AC||!soundOn) return; const t0=AC.currentTime+(when||0);
  const o=AC.createOscillator(), gn=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
  gn.gain.setValueAtTime(0.0001,t0); gn.gain.linearRampToValueAtTime(g||0.07,t0+0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn); gn.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.05);
}
function jingle(win){ if(!AC) return; const n=win?[523,659,784,1046]:[392,330,262]; n.forEach((f,i)=>beep(f,0.22,0.08,'square',i*0.13)); }
function engine(speedRatio,drifting,throttleOn){
  if(!AC) return;
  const on = soundOn && (phase==='race'||phase==='countdown');
  const target = on ? 0.015 + speedRatio*0.05 + (throttleOn?0.012:0) : 0;
  engGain.gain.setTargetAtTime(target, AC.currentTime, 0.06);
  engOsc.frequency.setTargetAtTime(50 + speedRatio*165 + (drifting?18:0), AC.currentTime, 0.05);
  engFilter.frequency.setTargetAtTime(300 + speedRatio*900, AC.currentTime, 0.08);
  noiseGain.gain.setTargetAtTime(on && drifting ? 0.05 : 0, AC.currentTime, 0.05);
}

/* ---------- cars / collection ---------- */
const CAR_POOL=[
 {id:'rookie-red',rarity:'common',color:'#e63a3a',name:'Red Starter'},
 {id:'blue-bolt',rarity:'common',color:'#3766ff',name:'Blue Bolt'},
 {id:'asphalt-ankle',rarity:'common',color:'#5a5a5a',name:'Asphalt Ankle'},
 {id:'citrus-nitro',rarity:'rare',color:'#ff9f1c',name:'Citrus Nitro'},
 {id:'mint-fang',rarity:'rare',color:'#2ec4b6',name:'Mint Fang'},
 {id:'hellfire-v8',rarity:'rare',color:'#ff4500',name:'Hellfire V8'},
 {id:'bullet-sprite',rarity:'rare',color:'#ff1493',name:'Bullet Sprite'},
 {id:'phoenix-vant',rarity:'epic',color:'#ff7bff',name:'Phoenix Vant'},
 {id:'ocean-drift',rarity:'epic',color:'#00d0ff',name:'Ocean Drift'},
 {id:'stormbreaker',rarity:'epic',color:'#9400d3',name:'Stormbreaker'},
 {id:'cobrafang-s',rarity:'epic',color:'#32cd32',name:'Cobra Fang'},
 {id:'golden-mirage',rarity:'legendary',color:'#ffcc00',name:'Golden Mirage'},
 {id:'shadow-wraith',rarity:'legendary',color:'#8b5cf6',name:'Shadow Wraith'},
 {id:'volcanic-valkyrie',rarity:'legendary',color:'#ff0040',name:'Volcanic Valkyrie'},
 {id:'neon-reaper',rarity:'legendary',color:'#00e676',name:'Neon Reaper'},
 {id:'orion-marshal',rarity:'legendary',color:'#00bfff',name:'Orion Marshal'}
];
const RARITY_STAT={common:{spd:1.00,acc:1.00,grp:1.00},rare:{spd:1.03,acc:1.03,grp:1.02},epic:{spd:1.06,acc:1.05,grp:1.04},legendary:{spd:1.09,acc:1.08,grp:1.06}};
function carByName(n){ for(const c of CAR_POOL) if(c.name===n) return c; return CAR_POOL[0]; }
function carStats(c){
  const base=RARITY_STAT[c.rarity]; const h=mulberry(c.id.length*7919+c.id.charCodeAt(0)*131)();
  return {spd:base.spd+(h-0.5)*0.012, acc:base.acc+((h*7)%1-0.5)*0.012, grp:base.grp+((h*13)%1-0.5)*0.012};
}
const RARITY_WEIGHT={common:72,rare:20,epic:7,legendary:1};
const CHEST_COST=150;

/* ---------- tracks ---------- */
const TRACK_DEFS=[
 {name:'Oval', theme:'day', ctrl:[[0,-120],[80,-85],[118,0],[85,85],[0,124],[-85,85],[-118,0],[-85,-85]]},
 {name:'City', theme:'dusk', ctrl:[[0,-120],[100,-80],[122,-20],[92,32],[0,35],[-105,35],[-130,-10],[-100,-85]]},
 {name:'Cross', theme:'night', ctrl:[[0,-130],[115,-85],[135,8],[85,80],[0,112],[-85,80],[-128,35],[-135,-45],[-85,-90]]},
 {name:'Square', theme:'day', ctrl:[[-110,-110],[110,-110],[110,110],[-110,110]]},
 {name:'Serpentine', theme:'dusk', ctrl:[[0,-120],[100,-80],[-115,-35],[125,35],[-85,95],[70,118]]},
 {name:'Figure 8', theme:'night', ctrl:[[0,-125],[95,-95],[110,0],[40,-20],[0,0],[-40,20],[-110,0],[-95,95],[0,125],[95,95],[40,20],[0,0],[-40,-20],[-95,-95]]},
 {name:'Harbor', theme:'day', ctrl:[[0,-125],[120,-110],[135,-30],[60,10],[120,60],[90,125],[0,110],[-90,125],[-135,50],[-120,-60],[-60,-110]]},
 {name:'Volcano', theme:'night', ctrl:[[0,-128],[70,-100],[128,-40],[95,30],[128,95],[40,128],[-60,100],[-128,110],[-100,20],[-128,-70],[-50,-105]]}
];
const THEMES={
 day:{grassA:'#3f9e4d',grassB:'#359146',asphalt:'#33343a',edge:'#f5f5f5',sky:null},
 dusk:{grassA:'#2e7d46',grassB:'#276b3c',asphalt:'#2c2c33',edge:'#ffe0b2',sky:null},
 night:{grassA:'#14532d',grassB:'#0f4423',asphalt:'#232329',edge:'#cfd8ff',sky:null}
};
const ROAD_HALF=27;
function catmull(p0,p1,p2,p3,t){ const t2=t*t,t3=t2*t; return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3); }
function buildCenterline(ctrl){
  const out=[]; const N=ctrl.length; const SUB=16;
  for(let i=0;i<N;i++){
    const p0=ctrl[(i-1+N)%N],p1=ctrl[i],p2=ctrl[(i+1)%N],p3=ctrl[(i+2)%N];
    for(let s=0;s<SUB;s++){ const u=s/SUB; out.push({x:catmull(p0[0],p1[0],p2[0],p3[0],u), y:catmull(p0[1],p1[1],p2[1],p3[1],u)}); }
  }
  const n=out.length; let total=0;
  for(let i=0;i<n;i++){ const a=out[i], b=out[(i+1)%n]; a.ang=Math.atan2(b.y-a.y,b.x-a.x); a.nx=-Math.sin(a.ang); a.ny=Math.cos(a.ang); a.dist=total; total+=Math.hypot(b.x-a.x,b.y-a.y); }
  out.totalLength=total;
  return out;
}
const trackCache={};
function getTrack(def){
  if(trackCache[def.name]) return trackCache[def.name];
  const pts=buildCenterline(def.ctrl);
  const tr={def:def, pts:pts, count:pts.length, totalLength:pts.totalLength, pads:[]};
  // boost pads: 3 per track at spread indices, alternating side offsets
  const idxs=[Math.floor(tr.count*0.22), Math.floor(tr.count*0.55), Math.floor(tr.count*0.83)];
  idxs.forEach((pi,k)=>{ const p=pts[pi]; const off=(k%2===0?-1:1)*11; tr.pads.push({x:p.x+p.nx*off, y:p.y+p.ny*off, ang:p.ang, idx:pi, cd:0}); });
  tr.nearCache=new Map();
  trackCache[def.name]=tr;
  return tr;
}
function nearestIdx(tr,x,y,seed){
  const n=tr.count; let best=1e18, bi=seed||0;
  for(let k=-42;k<=42;k++){ const i=((seed+k)%n+n)%n; const p=tr.pts[i]; const dx=x-p.x, dy=y-p.y; const d=dx*dx+dy*dy; if(d<best){best=d;bi=i;} }
  if(best>3600){ for(let i=0;i<n;i++){ const p=tr.pts[i]; const dx=x-p.x, dy=y-p.y; const d=dx*dx+dy*dy; if(d<best){best=d;bi=i;} } }
  return {i:bi, dist:Math.sqrt(best)};
}

/* ---------- track pre-render ---------- */
function renderTrackLayer(tr){
  const th=THEMES[tr.def.theme]; const pts=tr.pts;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(const p of pts){ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); }
  const M=86; minX-=M; minY-=M; maxX+=M; maxY+=M;
  const cw=Math.ceil(maxX-minX), ch=Math.ceil(maxY-minY);
  const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
  const g=cv.getContext('2d'); g.translate(-minX,-minY);
  // grass with mow stripes
  g.fillStyle=th.grassA; g.fillRect(minX,minY,cw,ch);
  g.fillStyle=th.grassB;
  const rnd=mulberry(tr.def.name.length*331+tr.def.name.charCodeAt(0)*17);
  for(let i=0;i<260;i++){ const gx=minX+rnd()*cw, gy=minY+rnd()*ch; g.globalAlpha=0.13+rnd()*0.12; g.beginPath(); g.arc(gx,gy,4+rnd()*15,0,7); g.fill(); }
  g.globalAlpha=1;
  // trees / rocks away from the road
  for(let i=0;i<46;i++){
    const gx=minX+rnd()*cw, gy=minY+rnd()*ch;
    const near=nearestIdx(tr,gx,gy,Math.floor(rnd()*tr.count));
    if(near.dist<ROAD_HALF+20) continue;
    if(tr.def.theme==='night'){ g.fillStyle='#0a3520'; } else { g.fillStyle='#1d6b32'; }
    g.beginPath(); g.arc(gx,gy,5+rnd()*5,0,7); g.fill();
    g.fillStyle='rgba(255,255,255,0.10)'; g.beginPath(); g.arc(gx-2,gy-2,2.5,0,7); g.fill();
  }
  const path=new Path2D();
  path.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) path.lineTo(pts[i].x,pts[i].y); path.closePath();
  // kerbs: alternating red/white via two dashed strokes
  g.lineJoin='round'; g.lineCap='butt';
  g.strokeStyle='#e8e8e8'; g.lineWidth=ROAD_HALF*2+7; g.setLineDash([13,13]); g.lineDashOffset=0; g.stroke(path);
  g.strokeStyle='#d32f2f'; g.setLineDash([13,13]); g.lineDashOffset=13; g.stroke(path);
  g.setLineDash([]);
  // asphalt
  g.strokeStyle=th.asphalt; g.lineWidth=ROAD_HALF*2; g.stroke(path);
  // subtle asphalt noise
  g.save(); g.clip(path); g.globalAlpha=0.05; g.fillStyle='#fff';
  for(let i=0;i<380;i++){ const gx=minX+rnd()*cw, gy=minY+rnd()*ch; g.fillRect(gx,gy,2,2); }
  g.restore(); g.globalAlpha=1;
  // edge lines
  for(const s of [-1,1]){
    g.strokeStyle=th.edge; g.globalAlpha=0.75; g.lineWidth=2;
    g.beginPath();
    for(let i=0;i<pts.length;i++){ const p=pts[i]; const ex=p.x+p.nx*s*(ROAD_HALF-2.5), ey=p.y+p.ny*s*(ROAD_HALF-2.5); if(i===0) g.moveTo(ex,ey); else g.lineTo(ex,ey); }
    g.closePath(); g.stroke(); g.globalAlpha=1;
  }
  // center dashes
  g.strokeStyle='rgba(255,255,255,0.30)'; g.lineWidth=2; g.setLineDash([9,11]); g.stroke(path); g.setLineDash([]);
  // start line (checker)
  const p0=pts[0];
  g.save(); g.translate(p0.x,p0.y); g.rotate(p0.ang);
  const sq=5.4;
  for(let rI=0;rI<2;rI++) for(let cI=-5;cI<5;cI++){ g.fillStyle=(rI+cI)%2===0?'#111':'#f5f5f5'; g.fillRect(rI*sq-3, cI*sq, sq, sq); }
  g.restore();
  tr.layer=cv; tr.layerOX=minX; tr.layerOY=minY;
  // skid layer
  const sk=document.createElement('canvas'); sk.width=cw; sk.height=ch;
  tr.skidLayer=sk; tr.skidCtx=sk.getContext('2d'); tr.skidCtx.translate(-minX,-minY);
  tr.bounds={minX:minX,minY:minY};
  return tr;
}

/* ---------- race state ---------- */
const MODES=['Quick Race','Grand Prix','Time Trial'];
let phase='menu'; // menu | countdown | race | paused | results
let mode=MODES[0];
let difficulty=1; // 0 Rookie 1 Pro 2 Master
const DIFF_NAMES=['Rookie','Pro','Master'];
let trackIdx=0, lapCount=3;
let track=null, racers=[], player=null;
let cam={x:0,y:0,zoom:1,shake:0};
let raceTime=0, countdownT=0, lastTimestamp=0;
let parts=[], floaters=[];
let gp=null; // {raceIdx, standings:Map name->pts, order:[trackIdx...]}
let ghostRec=null, ghostPlay=null, ghostTimer=0;
let resultShown=false;
const BOT_POOL=[
 {name:'VEX',color:'#f4a0ff'},{name:'NOVA',color:'#ffb347'},{name:'TURBO',color:'#34c759'},
 {name:'PIXEL',color:'#4db2ff'},{name:'BLAZE',color:'#ff5a3c'},{name:'ECHO',color:'#c0c0c0'},
 {name:'ORBIT',color:'#7CFC00'},{name:'DASH',color:'#ff69b4'}
];
function makeRacer(name,color,isPlayer,statsMul){
  return {name:name,color:color,isPlayer:!!isPlayer,x:0,y:0,vx:0,vy:0,angle:0,
    idx:0, prog:0, lap:0, finished:false, finishTime:0, lapStart:0, lastLap:0, bestLap:Infinity,
    boostTime:0, boostCharges:1, driftCharge:0, drifting:false, offroad:false,
    stats:statsMul||{spd:1,acc:1,grp:1}, lineOff:0, linePhase:Math.random()*10,
    skill:0.92+Math.random()*0.10, wob:Math.random()*100, wrongWay:false};
}
function setupRace(){
  const def=TRACK_DEFS[trackIdx];
  track=renderTrackLayer(getTrack(def));
  racers=[]; parts=[]; floaters=[];
  const pc=carByName(selectedCar);
  player=makeRacer('YOU', pc.color, true, carStats(pc));
  const bots=BOT_POOL.slice().sort(()=>Math.random()-0.5).slice(0, mode==='Time Trial'?0:5);
  const diffSpd=[0.90,0.97,1.03][difficulty];
  for(const b of bots){ const r=makeRacer(b.name,b.color,false,{spd:diffSpd,acc:1,grp:1}); r.skill=(0.90+Math.random()*0.09)*[0.94,1.0,1.05][difficulty]; racers.push(r); }
  racers.push(player);
  // grid: two columns behind the start line
  const pts=track.pts, n=track.count;
  const startI=0; const p0=pts[startI];
  racers.forEach((r,i)=>{
    const back=14+Math.floor(i/2)*17, side=(i%2===0?-1:1)*13;
    const gi=((startI - Math.round(back/ (track.totalLength/n)) )%n+n)%n;
    const gp0=pts[gi];
    r.x=gp0.x+gp0.nx*side; r.y=gp0.y+gp0.ny*side;
    r.angle=p0.ang; r.vx=0; r.vy=0; r.idx=gi; r.prog=gi-n; // prog counts from -n so crossing start = lap 0 begin
    r.lap=0; r.finished=false; r.lapStart=0; r.boostCharges=1; r.boostTime=0; r.driftCharge=0;
  });
  cam.x=player.x; cam.y=player.y; cam.zoom=1; cam.shake=0;
  raceTime=0; countdownT=3.6; resultShown=false;
  ghostPlay = (mode==='Time Trial' && ghosts[def.name]) ? ghosts[def.name] : null;
  ghostRec = (mode==='Time Trial') ? [] : null; ghostTimer=0;
  phase='countdown';
  $('menu').classList.add('hidden'); $('results').classList.add('hidden'); $('pauseMenu').classList.add('hidden');
  audioInit();
}
function startGP(){
  const order=[0,1,2,3,4,5,6,7].sort(()=>Math.random()-0.5).slice(0,4);
  gp={raceIdx:0, order:order, points:{}};
  trackIdx=order[0];
  lapCount=3;
  setupRace();
  toast('Grand Prix — Race 1 of 4: '+TRACK_DEFS[trackIdx].name);
}
function toast(msg,ms){
  const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(()=>{ t.style.display='none'; }, ms||1900);
}
function banner(msg,ms){
  const b=$('banner'); b.textContent=msg; b.style.display='block';
  clearTimeout(banner._t); banner._t=setTimeout(()=>{ b.style.display='none'; }, ms||1600);
}

/* ---------- input ---------- */
let steerTarget=0, pointerDown=false, pointerStartX=0, pointerId=null;
let keys=new Set();
let touchBoost=false;
canvas.addEventListener('pointerdown',e=>{
  audioInit();
  if(phase==='race'||phase==='countdown'){
    if(e.clientY>H-64 && e.clientX>W-84){ touchBoost=true; tryBoost(player); return; }
    if(e.clientY<44 && e.clientX>W-52){ pauseGame(); return; }
  }
  pointerDown=true; pointerId=e.pointerId; pointerStartX=e.clientX; 
});
canvas.addEventListener('pointermove',e=>{
  if(!pointerDown||e.pointerId!==pointerId) return;
  steerTarget=clamp((e.clientX-pointerStartX)/46,-1,1);
});
function endPointer(e){ if(e.pointerId===pointerId){ pointerDown=false; steerTarget=0; } touchBoost=false; }
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
window.addEventListener('keydown',e=>{
  keys.add(e.key);
  if(e.key==='Enter'&&phase==='menu') startFromMenu();
  if((e.key==='Escape'||e.key==='p'||e.key==='P')){ if(phase==='race') pauseGame(); else if(phase==='paused') resumeGame(); }
  if(e.key===' '){ if(phase==='race') tryBoost(player); e.preventDefault(); }
});
window.addEventListener('keyup',e=>keys.delete(e.key));
window.addEventListener('sideClick',()=>{ audioInit(); if(phase==='race') tryBoost(player); else if(phase==='menu') startFromMenu(); });
window.addEventListener('scrollUp',()=>{ if(phase==='menu'){ cycleTrack(1); } else cam.zoom=clamp(cam.zoom+0.07,0.7,1.5); });

/* ---------- physics ---------- */
const BASE_MAXV=252, BASE_ACCEL=205;
function tryBoost(r){
  if(!r||r.finished) return;
  if(r.boostCharges>0 && r.boostTime<=0.15){
    r.boostCharges--; r.boostTime=0.85;
    for(let i=0;i<10;i++) spawnPart(r.x,r.y,'#ffb300',16,(Math.random()-0.5)*60,(Math.random()-0.5)*60);
    if(r.isPlayer) beep(180,0.28,0.10,'sawtooth');
  }
}
function spawnPart(x,y,c,life,vx,vy){ if(parts.length>320) parts.shift(); parts.push({x:x,y:y,c:c,life:life,max:life,vx:vx||0,vy:vy||0}); }
function spawnFloater(x,y,text,color){ floaters.push({x:x,y:y,text:text,color:color||'#ffd54f',life:1.1}); }

function carInput(r,dt){
  if(r.isPlayer){
    let steer=steerTarget;
    if(keys.has('ArrowLeft')||keys.has('a')) steer=-1;
    if(keys.has('ArrowRight')||keys.has('d')) steer=1;
    const thr=(keys.has('ArrowUp')||keys.has('w'))?1:(pointerDown?0.92:0.9);
    const brake=(keys.has('ArrowDown')||keys.has('s'));
    const hb=keys.has('Shift')||keys.has('h');
    return {steer:steer,thr:brake?-0.55:thr,handbrake:hb};
  }
  // --- AI ---
  const pts=track.pts, n=track.count;
  r.linePhase+=dt*0.35;
  const look=8+Math.floor(Math.hypot(r.vx,r.vy)/26);
  const ti=((r.idx+look)%n+n)%n;
  const tp=pts[ti];
  const off=Math.sin(r.linePhase)*13*r.skill;
  const txp=tp.x+tp.nx*off, typ=tp.y+tp.ny*off;
  const ta=Math.atan2(typ-r.y,txp-r.x);
  let steer=clamp(angDiff(ta,r.angle)*2.4,-1,1);
  // corner speed control: look further ahead for sharp bends
  const fi=((r.idx+look+13)%n+n)%n;
  const bend=Math.abs(angDiff(pts[fi].ang, pts[ti].ang));
  let thr=1;
  if(bend>0.85) thr=0.55; else if(bend>0.5) thr=0.78;
  if(Math.abs(steer)>0.8) thr=Math.min(thr,0.8);
  // avoid the car ahead
  for(const o of racers){ if(o===r) continue;
    const dx=o.x-r.x, dy=o.y-r.y; const d2=dx*dx+dy*dy;
    if(d2<340){ const ahead=Math.cos(r.angle)*dx+Math.sin(r.angle)*dy; if(ahead>0){ steer+= (Math.sin(r.angle)*dx-Math.cos(r.angle)*dy)>0? -0.35:0.35; thr*=0.92; } }
  }
  // boost on straights when boost ready
  if(r.boostCharges>0 && bend<0.22 && Math.abs(steer)<0.25 && Math.random()<dt*0.5) tryBoost(r);
  const hb = bend>0.95 && Math.hypot(r.vx,r.vy)>150;
  return {steer:steer,thr:thr,handbrake:hb};
}
function stepCar(r,dt){
  if(r.finished){ r.vx*=0.92; r.vy*=0.92; r.x+=r.vx*dt; r.y+=r.vy*dt; return; }
  const inp=carInput(r,dt);
  const cosA=Math.cos(r.angle), sinA=Math.sin(r.angle);
  let vf=r.vx*cosA+r.vy*sinA, vl=-r.vx*sinA+r.vy*cosA;
  const maxV=BASE_MAXV*r.stats.spd;
  // rubber banding for bots (keeps races close, scales with difficulty)
  let rb=1;
  if(!r.isPlayer && mode!=='Time Trial'){
    const gap=player.prog-r.prog;
    rb=clamp(1+gap*0.000012*(difficulty===0?1.5:difficulty===2?0.55:1.0), difficulty===2?0.97:0.93, difficulty===0?1.05:1.085);
  }
  if(r.boostTime>0){
    r.boostTime-=dt;
    vf+= 340*r.stats.acc*dt;
    spawnPart(r.x-cosA*10, r.y-sinA*10, Math.random()<0.5?'#ff8f00':'#ffd54f', 12, -cosA*40+(Math.random()-0.5)*30, -sinA*40+(Math.random()-0.5)*30);
  } else if(inp.thr>0){
    vf+= inp.thr*BASE_ACCEL*r.stats.acc*rb*dt;
  } else {
    vf+= inp.thr*260*dt; // reverse / brake
  }
  // drag + rolling resistance
  vf-= vf*0.55*dt + Math.sign(vf)*6*dt;
  if(vf>maxV*(r.boostTime>0?1.32:1)) vf=Math.max(maxV*(r.boostTime>0?1.32:1), vf-420*dt);
  if(vf<-70) vf=-70;
  // steering
  const spd=Math.abs(vf);
  const steerAuthority=clamp(spd/95,0,1)*(vf<0?-1:1);
  const wantDrift = inp.handbrake && spd>105 && Math.abs(inp.steer)>0.25;
  r.angle += inp.steer * 2.75 * steerAuthority * dt * (r.drifting?1.30:1);
  // grip: kill lateral velocity
  const wasDrifting=r.drifting;
  r.drifting = wantDrift || (r.drifting && spd>95 && Math.abs(inp.steer)>0.2 && inp.handbrake);
  let gripRate = r.drifting? 2.0 : 9.5*r.stats.grp;
  if(r.offroad) gripRate*=0.8;
  vl*= Math.exp(-gripRate*dt);
  // drift charge & smoke
  if(r.drifting && spd>90){
    r.driftCharge=Math.min(1.6, r.driftCharge + dt*(0.55+Math.abs(vl)/160));
    if(Math.random()<0.75){
      const bx=r.x-cosA*8, by=r.y-sinA*8;
      spawnPart(bx+(-sinA)*5, by+(cosA)*5, 'rgba(200,200,200,0.8)', 20, -vl*(-sinA)*0.2, -vl*(cosA)*0.2);
      spawnPart(bx-(-sinA)*5, by-(cosA)*5, 'rgba(200,200,200,0.8)', 20, -vl*(-sinA)*0.2, -vl*(cosA)*0.2);
      drawSkid(r);
    }
  } else if(wasDrifting && !r.drifting){
    if(r.driftCharge>0.45){
      r.boostTime=Math.max(r.boostTime, 0.30+r.driftCharge*0.45);
      if(r.isPlayer){ banner(r.driftCharge>1.1?'🔥 MEGA DRIFT BOOST!':'⚡ Drift boost!',700); beep(520,0.16,0.08,'square'); }
    }
    r.driftCharge=0;
  }
  if(!inp.handbrake && !r.drifting) r.driftCharge=Math.max(0,r.driftCharge-dt*2.2);
  r.vx=cosA*vf - sinA*vl;
  r.vy=sinA*vf + cosA*vl;
  r.x+=r.vx*dt; r.y+=r.vy*dt;
  // progress / laps
  const near=nearestIdx(track, r.x, r.y, r.idx);
  const n=track.count;
  let delta=((near.i - r.idx)%n+n)%n; if(delta>n/2) delta-=n;
  r.idx=near.i; r.prog+=delta;
  r.offroad = near.dist > ROAD_HALF-3;
  if(r.offroad){ r.vx*=Math.exp(-1.5*dt); r.vy*=Math.exp(-1.5*dt); if(r.isPlayer && Math.random()<0.3) spawnPart(r.x,r.y,'#7a5a2e',10,(Math.random()-0.5)*30,(Math.random()-0.5)*30); }
  const lapNow=Math.floor(r.prog/n);
  if(lapNow>r.lap){
    r.lap=lapNow;
    const lt=raceTime-r.lapStart; r.lastLap=lt; if(lt>3 && lt<r.bestLap) r.bestLap=lt; r.lapStart=raceTime;
    if(r.isPlayer){
      if(r.lap>=lapCount){ finishRace(r); }
      else {
        beep(880,0.08,0.08);
        if(r.lap===lapCount-1) banner('🏁 FINAL LAP!',1200);
        else toast('Lap '+(r.lap+1)+' — '+fmt(lt),1300);
      }
    } else if(r.lap>=lapCount && !r.finished){ r.finished=true; r.finishTime=raceTime; }
  }
  // boost pads
  if(r.boostTime<=0){
    for(const pad of track.pads){
      if(pad.cd>0) continue;
      const dx=r.x-pad.x, dy=r.y-pad.y;
      if(dx*dx+dy*dy<300){
        r.boostTime=Math.max(r.boostTime,0.65); pad.cd=3.5;
        if(r.isPlayer){ beep(740,0.12,0.09,'square'); spawnFloater(r.x,r.y-14,'BOOST!','#ffd54f'); }
        for(let i=0;i<8;i++) spawnPart(pad.x,pad.y,'#ffee58',14,(Math.random()-0.5)*70,(Math.random()-0.5)*70);
      }
    }
  }
}
function drawSkid(r){
  const g=track.skidCtx; if(!g) return;
  const cosA=Math.cos(r.angle), sinA=Math.sin(r.angle);
  g.strokeStyle='rgba(10,10,10,0.35)'; g.lineWidth=2.4; g.lineCap='round';
  for(const s of [-5,5]){
    const wx=r.x - cosA*8 + (-sinA)*s, wy=r.y - sinA*8 + cosA*s;
    g.beginPath(); g.moveTo(wx - r.vx*0.016, wy - r.vy*0.016); g.lineTo(wx,wy); g.stroke();
  }
}
function collide(){
  for(let i=0;i<racers.length;i++) for(let j=i+1;j<racers.length;j++){
    const a=racers[i], b=racers[j];
    const dx=b.x-a.x, dy=b.y-a.y; const d=Math.hypot(dx,dy);
    if(d>0.01 && d<17){
      const push=(17-d)/2, ux=dx/d, uy=dy/d;
      a.x-=ux*push; a.y-=uy*push; b.x+=ux*push; b.y+=uy*push;
      const tvx=(a.vx+b.vx)/2, tvy=(a.vy+b.vy)/2;
      a.vx=lerp(a.vx,tvx,0.4); a.vy=lerp(a.vy,tvy,0.4); b.vx=lerp(b.vx,tvx,0.4); b.vy=lerp(b.vy,tvy,0.4);
      if(a.isPlayer||b.isPlayer){ cam.shake=Math.min(5,cam.shake+1.6); if(Math.random()<0.5) spawnPart((a.x+b.x)/2,(a.y+b.y)/2,'#fff',7,(Math.random()-0.5)*50,(Math.random()-0.5)*50); }
    }
  }
}
function finishRace(r){
  r.finished=true; r.finishTime=raceTime;
  if(r.isPlayer){
    // let bots' current state stand; compute final order by progress for unfinished bots
    phase='results';
    stats.races++;
    const order=standings();
    const pos=order.indexOf(player)+1;
    if(pos===1) stats.wins++;
    if(pos<=3) stats.podiums++;
    saveJSON('r1racer_stats',stats);
    // best times
    const tn=track.def.name;
    if(!bestTimes[tn] || r.finishTime<bestTimes[tn]){ bestTimes[tn]=r.finishTime; saveJSON('r1racer_bestTimes',bestTimes); }
    if(player.bestLap<Infinity && (!bestLaps[tn] || player.bestLap<bestLaps[tn])){ bestLaps[tn]=player.bestLap; saveJSON('r1racer_bestLaps',bestLaps); }
    // ghost save (time trial)
    if(mode==='Time Trial' && ghostRec && ghostRec.length>10){
      const prev=ghosts[tn];
      if(!prev || r.finishTime<prev.time){ ghosts[tn]={time:r.finishTime, samples:ghostRec}; saveJSON('r1racer_ghosts',ghosts); }
    }
    // rewards
    let coinWin=[120,80,55,35,22,14][pos-1]||10, chestWin=0;
    if(gp){
      const ptsTable=[10,6,4,3,2,1];
      for(let i=0;i<order.length;i++){ const nm=order[i].name; gp.points[nm]=(gp.points[nm]||0)+ptsTable[i]; }
      if(pos===1) chestWin=1;
    } else if(pos===1) chestWin=1;
    coins+=coinWin; chests+=chestWin;
    saveJSON('r1racer_coins',coins); saveJSON('r1racer_chests',chests);
    try{ localStorage.setItem('chestCount',String(chests)); }catch(e){}
    jingle(pos===1);
    showResults(pos,coinWin,chestWin,order);
  }
}
function standings(){
  return racers.slice().sort((a,b)=>{
    const pa=a.finished? (lapCount*track.count + (1e7 - a.finishTime)) : a.prog;
    const pb=b.finished? (lapCount*track.count + (1e7 - b.finishTime)) : b.prog;
    return pb-pa;
  });
}

/* ---------- rendering ---------- */
function drawCar(r,isGhost){
  ctx.save(); ctx.translate(r.x,r.y); ctx.rotate(r.angle+Math.PI/2);
  if(isGhost) ctx.globalAlpha=0.35;
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.30)'; roundRect(-7,-9+3,14,19,4); ctx.fill();
  // boost flame
  if(r.boostTime>0 && !isGhost){
    const fl=8+Math.random()*9;
    const gr=ctx.createLinearGradient(0,10,0,10+fl+8);
    gr.addColorStop(0,'rgba(255,220,80,0.95)'); gr.addColorStop(0.5,'rgba(255,120,0,0.7)'); gr.addColorStop(1,'rgba(255,60,0,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.moveTo(-4,9); ctx.lineTo(0,10+fl+8); ctx.lineTo(4,9); ctx.closePath(); ctx.fill();
  }
  // wheels
  ctx.fillStyle='#141414';
  const wy=r.isPlayer||true? (r.drifting?1:0):0;
  roundRect(-9,-7,4,6,1.5); ctx.fill(); roundRect(5,-7,4,6,1.5); ctx.fill();
  roundRect(-9,3,4,6,1.5); ctx.fill(); roundRect(5,3,4,6,1.5); ctx.fill();
  // body
  const grd=ctx.createLinearGradient(-7,0,7,0);
  grd.addColorStop(0,shade(r.color,-28)); grd.addColorStop(0.5,r.color); grd.addColorStop(1,shade(r.color,-28));
  ctx.fillStyle=isGhost?'#9fd8ff':grd; roundRect(-7,-10,14,20,5); ctx.fill();
  // nose + stripe
  ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fillRect(-1.5,-10,3,7);
  // cockpit
  ctx.fillStyle='#18222e'; roundRect(-4.5,-3.5,9,8,3); ctx.fill();
  ctx.fillStyle='rgba(160,220,255,0.85)'; roundRect(-3.5,-2.5,7,3.4,2); ctx.fill();
  // spoiler
  ctx.fillStyle=shade(r.color,-45); roundRect(-7.5,7.5,15,3,1.5); ctx.fill();
  // headlights
  ctx.fillStyle='#fff9c4'; ctx.fillRect(-5.5,-10.5,3,2); ctx.fillRect(2.5,-10.5,3,2);
  ctx.restore();
  // name tag for bots close to player
  if(!r.isPlayer && !isGhost){
    const d=Math.hypot(r.x-player.x,r.y-player.y);
    if(d<95){ ctx.font='bold 7px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='rgba(0,0,0,0.55)'; const wdt=ctx.measureText(r.name).width+6; ctx.fillRect(r.x-wdt/2,r.y-24,wdt,9); ctx.fillStyle='#fff'; ctx.fillText(r.name,r.x,r.y-17); ctx.textAlign='left'; }
  }
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=clamp(r,0,255); g=clamp(g,0,255); b=clamp(b,0,255);
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function render(){
  ctx.fillStyle='#0b3a16'; ctx.fillRect(0,0,W,H);
  if(!track||!player){ return; }
  // camera
  const look=0.34;
  const txp=player.x+player.vx*look, typ=player.y+player.vy*look;
  cam.x=lerp(cam.x,txp,0.09); cam.y=lerp(cam.y,typ,0.09);
  const spdR=clamp(Math.hypot(player.vx,player.vy)/300,0,1);
  const zt=cam.zoom*(1.04-spdR*0.13);
  ctx.save();
  ctx.translate(W/2,H/2); ctx.scale(zt,zt);
  if(cam.shake>0.2){ ctx.translate((Math.random()-0.5)*cam.shake,(Math.random()-0.5)*cam.shake); cam.shake*=0.86; }
  ctx.translate(-cam.x,-cam.y);
  // track + skids
  ctx.drawImage(track.layer, track.layerOX, track.layerOY);
  ctx.drawImage(track.skidLayer, track.layerOX, track.layerOY);
  // boost pads
  for(const pad of track.pads){
    ctx.save(); ctx.translate(pad.x,pad.y); ctx.rotate(pad.ang);
    const ready=pad.cd<=0;
    const pulse=ready? (0.75+0.25*Math.sin(performance.now()/150)) : 0.35;
    ctx.globalAlpha=pulse;
    ctx.fillStyle=ready?'#ffee58':'#8a8a5a';
    ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(-3,-7); ctx.lineTo(-1,0); ctx.lineTo(-3,7); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(2,0); ctx.lineTo(-8,-7); ctx.lineTo(-6,0); ctx.lineTo(-8,7); ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.globalAlpha=1;
  }
  // ghost
  if(ghostPlay && ghostPlay.samples && phase!=='countdown'){
    const gi=Math.min(ghostPlay.samples.length-1, Math.floor(raceTime*10));
    const s=ghostPlay.samples[gi];
    if(s) drawCar({x:s[0],y:s[1],angle:s[2],color:'#9fd8ff',boostTime:0,drifting:false,isPlayer:false,name:''}, true);
  }
  // racers sorted by y for overlap
  const sorted=racers.slice().sort((a,b)=>a.y-b.y);
  for(const r of sorted) drawCar(r,false);
  // particles
  for(const p of parts){ ctx.globalAlpha=clamp(p.life/p.max,0,1); ctx.fillStyle=p.c; ctx.fillRect(p.x-1.4,p.y-1.4,2.8,2.8); }
  ctx.globalAlpha=1;
  // floaters
  ctx.font='bold 8px sans-serif'; ctx.textAlign='center';
  for(const f of floaters){ ctx.globalAlpha=clamp(f.life,0,1); ctx.fillStyle=f.color; ctx.fillText(f.text,f.x,f.y); }
  ctx.globalAlpha=1; ctx.textAlign='left';
  ctx.restore();
  drawHUD();
  if(phase==='countdown'){
    const n=Math.ceil(countdownT-0.6);
    ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,0,W,H);
    // start lights
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(W/2-26+i*26, 96, 10, 0, 7); ctx.fillStyle= countdownT>3.05-i*0.95 ? '#ff2d2d':'#571b1b'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#ddd'; ctx.stroke(); }
    ctx.font='900 34px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#fff';
    ctx.fillText(countdownT>0.6? String(Math.max(1,n)) : 'GO!', W/2, 150);
    ctx.font='10px sans-serif'; ctx.fillText(track.def.name+' — '+lapCount+' laps', W/2, 172);
    ctx.textAlign='left';
  }
}
function drawHUD(){
  // top bar
  ctx.fillStyle='rgba(0,0,0,0.62)'; ctx.fillRect(0,0,W,26);
  const order=standings(); const pos=order.indexOf(player)+1;
  ctx.fillStyle='#fff'; ctx.font='900 15px sans-serif';
  ctx.fillText('P'+pos, 6, 18);
  ctx.font='8px sans-serif'; ctx.fillStyle='#cfe8d4';
  ctx.fillText('/'+racers.length, 30, 18);
  ctx.font='bold 10px sans-serif'; ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.fillText('LAP '+clamp(player.lap+1,1,lapCount)+'/'+lapCount, W/2, 12);
  ctx.font='8px sans-serif'; ctx.fillStyle='#9fd8ae';
  ctx.fillText(fmt(raceTime), W/2, 23);
  ctx.textAlign='right'; ctx.fillStyle='#ffd54f'; ctx.font='bold 9px sans-serif';
  const bt=bestTimes[track.def.name];
  ctx.fillText(bt? 'BEST '+fmt(bt):'', W-30, 12);
  ctx.fillStyle='#9fd8ae'; ctx.font='8px sans-serif';
  if(player.lastLap) ctx.fillText('LAST '+fmt(player.lastLap), W-30, 23);
  ctx.textAlign='left';
  // pause button hint
  ctx.fillStyle='rgba(255,255,255,0.75)'; ctx.font='11px sans-serif'; ctx.fillText('⏸', W-20, 17);
  // minimap
  drawMinimap(order);
  // bottom-left: lap times tower (top 3)
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(4,H-52,74,48);
  ctx.font='7.5px sans-serif';
  order.slice(0,4).forEach((r,i)=>{
    ctx.fillStyle= r.isPlayer? '#ffd54f':'#e8f5e9';
    const gap = r.finished? fmt(r.finishTime) : (i===0?'—': '+'+Math.max(0,(order[0].prog-r.prog)/Math.max(1,Math.hypot(r.vx,r.vy)+40)).toFixed(1));
    ctx.fillText((i+1)+'. '+r.name, 8, H-41+i*11);
    ctx.textAlign='right'; ctx.fillText(r.finished?'FIN':('L'+clamp(r.lap+1,1,lapCount)), 74, H-41+i*11); ctx.textAlign='left';
  });
  // bottom-right: boost button + meters
  const bx=W-44, by=H-44;
  ctx.beginPath(); ctx.arc(bx,by,17,0,7); ctx.fillStyle= player.boostCharges>0? 'rgba(255,160,0,0.85)':'rgba(90,90,90,0.6)'; ctx.fill();
  ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.fillText('⚡', bx, by+5); ctx.textAlign='left';
  ctx.font='bold 8px sans-serif'; ctx.fillStyle='#fff'; ctx.fillText('x'+player.boostCharges, bx-6, by+27);
  // drift/boost meter
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(W-96,H-14,64,6);
  ctx.fillStyle= player.boostTime>0? '#ff8f00' : '#ffee58';
  const mw= player.boostTime>0? clamp(player.boostTime/1.1,0,1) : clamp(player.driftCharge/1.2,0,1);
  ctx.fillRect(W-96,H-14,64*mw,6);
  ctx.font='7px sans-serif'; ctx.fillStyle='#cfe8d4'; ctx.fillText(player.boostTime>0?'BOOST':'DRIFT', W-96, H-17);
  // speed
  const kmh=Math.round(Math.hypot(player.vx,player.vy)*0.62);
  ctx.font='900 13px sans-serif'; ctx.fillStyle='#fff'; ctx.textAlign='right'; ctx.fillText(kmh+'', W-104, H-20);
  ctx.font='7px sans-serif'; ctx.fillStyle='#9fd8ae'; ctx.fillText('km/h', W-104, H-12); ctx.textAlign='left';
  if(player.offroad){ ctx.font='bold 8px sans-serif'; ctx.fillStyle='#ffab91'; ctx.textAlign='center'; ctx.fillText('OFF ROAD', W/2, 36); ctx.textAlign='left'; }
}
function drawMinimap(order){
  const pts=track.pts; const S=0.088, ox=W-58, oy=32;
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(ox-4,oy-4,58,58);
  ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=2; ctx.beginPath();
  for(let i=0;i<pts.length;i+=3){ const p=pts[i]; const mx=ox+29+p.x*S, my=oy+29+p.y*S; if(i===0) ctx.moveTo(mx,my); else ctx.lineTo(mx,my); }
  ctx.closePath(); ctx.stroke();
  for(const r of order){ ctx.fillStyle=r.isPlayer?'#ffd54f':r.color; ctx.beginPath(); ctx.arc(ox+29+r.x*S, oy+29+r.y*S, r.isPlayer?3:2.2, 0, 7); ctx.fill(); }
}
/* ---------- main loop ---------- */
function update(dt){
  if(phase==='countdown'){
    countdownT-=dt;
    if(countdownT<=0.55 && countdownT+dt>0.55) beep(880,0.3,0.11);
    else if(Math.ceil(countdownT-0.6)!==Math.ceil(countdownT+dt-0.6) && countdownT>0.6) beep(440,0.12,0.09);
    if(countdownT<=0){ phase='race'; banner('GO!',600); }
    engine(0,false,false);
    return;
  }
  if(phase!=='race') return;
  raceTime+=dt;
  for(const pad of track.pads) if(pad.cd>0) pad.cd-=dt;
  const sub=2, sdt=dt/sub;
  for(let s=0;s<sub;s++){ for(const r of racers) stepCar(r,sdt); collide(); }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94; p.life-=dt*46; if(p.life<=0) parts.splice(i,1); }
  for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.y-=16*dt; f.life-=dt; if(f.life<=0) floaters.splice(i,1); }
  // ghost recording (10 Hz)
  if(ghostRec){ ghostTimer+=dt; if(ghostTimer>=0.1){ ghostTimer=0; ghostRec.push([Math.round(player.x),Math.round(player.y),Math.round(player.angle*100)/100]); } }
  const spdR=clamp(Math.hypot(player.vx,player.vy)/300,0,1);
  engine(spdR, player.drifting, true);
}
let lastNow=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-lastNow)/1000; lastNow=now;
  if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  if(phase==='race'||phase==='countdown') update(dt);
  if(phase!=='menu') render();
}
requestAnimationFrame(frame);

/* ---------- menus / UI ---------- */
function refreshMenu(){
  const c=carByName(selectedCar);
  $('carDot').style.background=c.color;
  $('carName').textContent=c.name;
  const rar=$('carRar'); rar.textContent='★ '+c.rarity.toUpperCase(); rar.className='rar-'+c.rarity;
  $('btnMode').textContent=mode;
  $('btnDiff').textContent=DIFF_NAMES[difficulty];
  $('btnTrack').textContent=TRACK_DEFS[trackIdx].name;
  $('btnLaps').textContent=lapCount+' Laps';
  $('chestN').textContent=chests;
  $('trackRow').style.opacity= mode==='Grand Prix'? '0.4':'1';
  const tn=TRACK_DEFS[trackIdx].name;
  $('statsLine').innerHTML=
    '🪙 '+coins+' coins &nbsp;•&nbsp; 🏆 '+stats.wins+'W / '+stats.races+' races<br>'+
    (bestTimes[tn]? 'Best on '+tn+': '+fmt(bestTimes[tn])+' &nbsp;•&nbsp; ' : '')+
    'Cars: '+ownedCars.length+'/16';
  $('btnSound').textContent= soundOn? '🔊 Sound':'🔇 Muted';
}
function cycleTrack(d){ trackIdx=(trackIdx+d+TRACK_DEFS.length)%TRACK_DEFS.length; refreshMenu(); beep(660,0.05,0.05); }
function startFromMenu(){
  audioInit();
  if(mode==='Grand Prix'){ startGP(); }
  else setupRace();
}
function pauseGame(){ if(phase!=='race') return; phase='paused'; $('pauseMenu').classList.remove('hidden'); engine(0,false,false); }
function resumeGame(){ if(phase!=='paused') return; phase='race'; $('pauseMenu').classList.add('hidden'); lastNow=performance.now(); }
function quitToMenu(){
  phase='menu'; gp=null;
  $('pauseMenu').classList.add('hidden'); $('results').classList.add('hidden');
  $('menu').classList.remove('hidden'); refreshMenu(); engine(0,false,false);
}
function showResults(pos,coinWin,chestWin,order){
  resultShown=true;
  const isGP = !!gp;
  $('resTitle').textContent= pos===1?'🏆 VICTORY!': pos===2?'🥈 2nd PLACE': pos===3?'🥉 3rd PLACE':'P'+pos+' FINISH';
  $('resSub').textContent= track.def.name+' • '+DIFF_NAMES[difficulty]+(isGP? ' • GP Race '+(gp.raceIdx+1)+'/4':' • '+mode);
  let html='<table>';
  order.forEach((r,i)=>{
    html+='<tr class="'+(r.isPlayer?'me':'')+'"><td>P'+(i+1)+'</td><td>'+r.name+'</td><td>'+(r.finished?fmt(r.finishTime):'DNF')+'</td><td>'+(r.bestLap<Infinity?'⚡'+fmt(r.bestLap):'')+'</td></tr>';
  });
  html+='</table>';
  if(isGP){
    const sorted=Object.keys(gp.points).map(n=>({n:n,p:gp.points[n]})).sort((a,b)=>b.p-a.p);
    html+='<div style="margin-top:5px;font-size:9px;color:#ffd54f">GP STANDINGS</div><table>';
    sorted.forEach(s=>{ html+='<tr class="'+(s.n==='YOU'?'me':'')+'"><td>'+s.n+'</td><td>'+s.p+' pts</td></tr>'; });
    html+='</table>';
  }
  $('resTable').innerHTML=html;
  $('resReward').innerHTML='🪙 +'+coinWin+' coins'+(chestWin?' &nbsp;🎁 +1 chest!':'')+'<br>Your time: '+fmt(player.finishTime)+(player.bestLap<Infinity?' • Best lap '+fmt(player.bestLap):'');
  $('btnNext').textContent= isGP? (gp.raceIdx<3?'Next Race ▶':'Finish GP 🏆') : 'Race Again';
  $('results').classList.remove('hidden');
}
$('btnStart').onclick=()=>{ startFromMenu(); };
$('btnMode').onclick=()=>{ const i=MODES.indexOf(mode); mode=MODES[(i+1)%MODES.length]; refreshMenu(); };
$('btnDiff').onclick=()=>{ difficulty=(difficulty+1)%3; refreshMenu(); };
$('btnTrack').onclick=()=>cycleTrack(1);
$('btnLaps').onclick=()=>{ lapCount= lapCount>=5?2:lapCount+1; refreshMenu(); };
$('btnSound').onclick=()=>{ soundOn=!soundOn; saveJSON('r1racer_sound',soundOn); refreshMenu(); };
$('btnChest').onclick=()=>{
  if(chests>0){ openChest(); }
  else if(coins>=CHEST_COST){
    if(confirmChest()){ coins-=CHEST_COST; saveJSON('r1racer_coins',coins); chests++; openChest(); }
  } else toast('Need a chest — win races or save '+CHEST_COST+' coins (have '+coins+')',2400);
  refreshMenu();
};
function confirmChest(){ return true; } // tap again flow simplified: direct buy handled below
function openChest(){
  if(chests<=0) return;
  chests--; saveJSON('r1racer_chests',chests); try{ localStorage.setItem('chestCount',String(chests)); }catch(e){}
  let total=0; for(const k in RARITY_WEIGHT) total+=RARITY_WEIGHT[k];
  let roll=Math.random()*total, rarity='common';
  for(const r of ['common','rare','epic','legendary']){ roll-=RARITY_WEIGHT[r]; if(roll<=0){ rarity=r; break; } }
  const cand=CAR_POOL.filter(c=>c.rarity===rarity);
  const pick=cand[Math.floor(Math.random()*cand.length)];
  const isNew=ownedCars.indexOf(pick.name)<0;
  if(isNew){ ownedCars.push(pick.name); saveJSON('ownedCars',ownedCars); }
  else { coins+=40; saveJSON('r1racer_coins',coins); }
  audioInit(); beep(660,0.1,0.08); setTimeout(()=>beep(880,0.14,0.08),110); setTimeout(()=>beep(1320,0.2,0.08),240);
  banner('🎁 '+pick.name+' ('+rarity.toUpperCase()+')'+(isNew?' NEW!':' +40 coins (dupe)'),2600);
  refreshMenu();
}
function openGarage(){
  const grid=$('garageGrid'); grid.innerHTML='';
  for(const c of CAR_POOL){
    const owned=ownedCars.indexOf(c.name)>=0;
    const st=carStats(c);
    const d=document.createElement('div');
    d.className='gcar'+(c.name===selectedCar?' sel':'')+(owned?'':' locked');
    d.innerHTML='<div class="sw" style="background:'+c.color+'"></div><b>'+c.name+'</b><br><span class="rar-'+c.rarity+'">'+c.rarity.toUpperCase()+'</span>'+
      '<div class="bars">SPD '+'▮'.repeat(Math.round(st.spd*10)-9)+' '+Math.round(st.spd*100)+'<br>ACC '+'▮'.repeat(Math.round(st.acc*10)-9)+' '+Math.round(st.acc*100)+'<br>GRP '+'▮'.repeat(Math.round(st.grp*10)-9)+' '+Math.round(st.grp*100)+'</div>';
    if(owned) d.onclick=()=>{ selectedCar=c.name; try{ localStorage.setItem('selectedCar',selectedCar); }catch(e){} openGarage(); refreshMenu(); beep(760,0.06,0.06); };
    grid.appendChild(d);
  }
  $('garageInfo').textContent='Owned '+ownedCars.length+'/16 — higher rarity = better stats';
  $('garage').classList.remove('hidden');
}
$('btnGarage').onclick=openGarage;
$('btnGarageBack').onclick=()=>{ $('garage').classList.add('hidden'); refreshMenu(); };
$('btnResGarage').onclick=()=>{ openGarage(); };
$('btnNext').onclick=()=>{
  $('results').classList.add('hidden');
  if(gp){
    if(gp.raceIdx<3){ gp.raceIdx++; trackIdx=gp.order[gp.raceIdx]; setupRace(); toast('GP Race '+(gp.raceIdx+1)+' of 4: '+TRACK_DEFS[trackIdx].name); }
    else { const sorted=Object.keys(gp.points).map(n=>({n:n,p:gp.points[n]})).sort((a,b)=>b.p-a.p); const champ=sorted[0]; gp=null; quitToMenu(); banner(champ.n==='YOU'?'🏆 GRAND PRIX CHAMPION!':'GP winner: '+champ.n,3000); }
  } else setupRace();
};
$('btnResMenu').onclick=()=>{ gp=null; quitToMenu(); };
$('btnResume').onclick=resumeGame;
$('btnRestart').onclick=()=>{ $('pauseMenu').classList.add('hidden'); if(gp){ setupRace(); } else setupRace(); };
$('btnQuit').onclick=()=>{ gp=null; quitToMenu(); };
refreshMenu();
// test hooks (used by automated verification)
window.__racer={ get phase(){return phase;}, get racers(){return racers;}, get player(){return player;},
  start:()=>startFromMenu(), setMode:m=>{mode=m;}, standings:standings,
  step:(dt)=>{ update(dt); }, track:()=>track };
})();
</script>
