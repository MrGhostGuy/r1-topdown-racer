<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>R1 Drift Racer – Top-Down</title>
<meta name="viewport" content="width=240,height=282,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#0B0E13;font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;}
#canvas{display:block;width:240px;height:282px;background:#0B0E13;}
.panel{position:absolute;top:0;left:0;width:240px;height:282px;display:flex;flex-direction:column;align-items:center;color:#E8EDF4;z-index:20;padding:9px 0 7px;box-sizing:border-box;overflow:hidden;background:linear-gradient(180deg,#FE5000,#FE5000) top/100% 2px no-repeat,radial-gradient(120% 60% at 50% -10%,rgba(254,80,0,.13),rgba(254,80,0,0) 60%),linear-gradient(180deg,#131922 0%,#0B0E13 78%);}
.logo{font-size:23px;font-weight:900;letter-spacing:1.5px;line-height:1;text-align:center;color:#F5F8FC;text-shadow:0 2px 10px rgba(0,0,0,.45);}
.logo span{color:#FE5000;}
.sub{text-align:center;font-size:8px;color:#7C8DA6;letter-spacing:3px;margin:3px 0 6px;text-transform:uppercase;font-weight:600;}
.carChip{display:flex;align-items:center;gap:7px;background:#161D28;border:1px solid #28323F;border-radius:10px;padding:4px 12px 4px 5px;font-size:9px;font-weight:600;margin-bottom:6px;box-shadow:0 2px 8px rgba(0,0,0,.35);}
.carChip .dot{width:16px;height:16px;border-radius:5px;border:2px solid rgba(255,255,255,.75);box-shadow:inset 0 0 4px rgba(0,0,0,.4);}
button{font-family:inherit;cursor:pointer;border:1px solid #2B3646;background:#171F2A;color:#E8EDF4;border-radius:8px;font-size:10px;font-weight:600;letter-spacing:.3px;padding:5px 8px;margin:2px;box-shadow:0 1px 3px rgba(0,0,0,.3);}
button:active{background:#232F3F;border-color:#FE5000;}
button.big{font-size:13px;font-weight:800;letter-spacing:1.2px;padding:9px 22px;background:linear-gradient(180deg,#FF7A29,#FE5000);border-color:#FF9A52;color:#fff;text-shadow:0 1px 2px rgba(120,40,0,.45);box-shadow:0 4px 14px rgba(254,80,0,.35),0 2px 0 #A83200;border-radius:10px;margin:4px 0 3px;}
button.big:active{transform:translateY(2px);box-shadow:0 2px 6px rgba(254,80,0,.3),0 0 0 #A83200;}
button.daily{background:#0D2B33;border-color:#155E6B;color:#7FE7F2;font-weight:700;letter-spacing:.4px;box-shadow:0 2px 8px rgba(0,0,0,.3);}
button.daily:active{background:#11404C;border-color:#2DD4EE;}
.row{display:flex;gap:4px;justify-content:center;width:216px;}
.row>div{flex:1;}
.row button{width:100%;}
.lbl{font-size:7px;color:#67788E;text-transform:uppercase;letter-spacing:1.5px;text-align:center;font-weight:700;}
.sec{font-size:8px;color:#7C8DA6;text-transform:uppercase;letter-spacing:2.5px;font-weight:700;margin:7px 0 1px;}
.statsLine{font-size:8px;color:#A9B7C6;margin-top:4px;text-align:center;line-height:1.55;padding:0 8px;}
table{border-collapse:collapse;font-size:9px;color:#E8EDF4;}
th{font-size:7px;text-transform:uppercase;letter-spacing:1px;color:#7C8DA6;font-weight:700;}
td,th{padding:2.5px 6px;text-align:left;}
td{border-bottom:1px solid rgba(255,255,255,.055);}
tr.me td{color:#FFC46B;font-weight:700;border-bottom-color:rgba(254,80,0,.35);}
h3{margin:3px 0 5px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#F5F8FC;font-weight:800;}
.tabs{display:flex;gap:3px;margin-bottom:4px;}
.tabs button{font-size:9px;padding:4px 7px;}
.tabs button.on{background:linear-gradient(180deg,#FF7A29,#FE5000);color:#fff;border-color:#FF9A52;font-weight:700;}
.scrollBox{width:228px;overflow-y:auto;flex:1;padding:2px;scrollbar-width:thin;scrollbar-color:#2B3646 transparent;}
.scrollBox::-webkit-scrollbar{width:4px;}
.scrollBox::-webkit-scrollbar-thumb{background:#2B3646;border-radius:2px;}
.garageGrid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;}
.gcar{width:68px;border-radius:10px;padding:5px 2px;text-align:center;font-size:7px;line-height:1.35;border:1px solid #26303E;background:#131A24;box-shadow:0 2px 6px rgba(0,0,0,.25);}
.gcar .sw{height:14px;border-radius:5px;margin-bottom:3px;border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 0 5px rgba(0,0,0,.35);}
.gcar.sel{border-color:#FE5000;background:rgba(254,80,0,.10);box-shadow:0 0 0 1px #FE5000,0 4px 10px rgba(0,0,0,.35);}
.gcar.locked{opacity:.38;filter:grayscale(.85);}
.bars{font-size:6px;color:#93A7B8;text-align:left;margin:1px 3px 0;line-height:1.5;}
.ach{display:flex;gap:6px;align-items:center;background:#131A24;border:1px solid #232D3B;border-radius:10px;padding:5px 7px;margin:3px 2px;font-size:8px;text-align:left;}
.ach .ic{font-size:13px;}
.ach.done{border-color:rgba(255,196,107,.55);}
.ach.locked{opacity:.55;}
#toast{position:absolute;top:112px;left:50%;transform:translateX(-50%);width:auto;max-width:224px;white-space:nowrap;text-align:center;font-size:11px;font-weight:700;letter-spacing:.3px;color:#F5F8FC;background:rgba(10,13,18,.88);border:1px solid #2B3646;border-radius:999px;padding:6px 14px;box-shadow:0 6px 18px rgba(0,0,0,.45);display:none;pointer-events:none;z-index:15;}
#banner{position:absolute;top:52px;left:0;width:240px;text-align:center;font-size:16px;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8),0 0 18px rgba(254,80,0,.45);display:none;pointer-events:none;z-index:15;}
#achPop{position:absolute;bottom:64px;left:8px;width:224px;background:rgba(15,19,26,.95);border:1px solid rgba(255,196,107,.6);border-radius:10px;color:#FFD98A;font-size:9px;padding:7px 9px;display:none;z-index:16;box-sizing:border-box;box-shadow:0 8px 20px rgba(0,0,0,.5);}
.hidden{display:none!important;}
.rar-common{color:#B8C0CC}.rar-rare{color:#58B7FF}.rar-epic{color:#C792FF}.rar-legendary{color:#FFC94D}.rar-mythic{color:#FF5C8A}
.xpbar{width:150px;height:5px;background:#1E2632;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;}
.xpbar>div{height:100%;background:linear-gradient(90deg,#FE5000,#FFC94D);}
#menu{padding:4px 0 2px;}
#menu .logo{font-size:18px;}
#menu .sub{margin:1px 0 3px;}
#menu .carChip{margin-bottom:3px;padding:2px 9px 2px 3px;}
#menu .carChip .dot{width:13px;height:13px;}
#menu button{padding:3.5px 5px;margin:1px;font-size:9.5px;}
#menu button.big{padding:6px 20px;margin:2px 0 1px;font-size:12.5px;}
#menu .lbl{display:none;}
#menu .statsLine{margin-top:1px;line-height:1.32;font-size:7.5px;}
#menu .xpbar{width:84px;}
#menu #ctrlHelp{margin-top:0;}
</style>

</head>
<body>
<canvas id="canvas" width="240" height="282"></canvas>
<div id="banner"></div>
<div id="toast"></div>
<div id="achPop"></div>

<div id="menu" class="panel">
  <div class="logo">R1 DRIFT <span>RACER</span></div>
  <div class="sub">Top-Down Arcade Racing</div>
  <div class="carChip"><div class="dot" id="carDot"></div><span id="carName">Red Starter</span><span id="carRar"></span></div>
  <button class="big" id="btnStart">🏁 START RACE</button>
  <button class="daily" id="btnDaily" style="width:216px">📅 Daily Challenge</button>
  <div class="row">
    <div><div class="lbl">Mode</div><button id="btnMode">Quick Race</button></div>
    <div><div class="lbl">Difficulty</div><button id="btnDiff">Pro</button></div>
    <div id="lapsBox"><div class="lbl">Laps</div><button id="btnLaps">3 Laps</button></div>
  </div>
  <div class="row" id="trackRow">
    <div><div class="lbl">Track / Cup</div><button id="btnTrack">Oval</button></div>
    <div><div class="lbl">Direction</div><button id="btnRev">Normal</button></div>
    <div><div class="lbl">Weather</div><button id="btnWx">Clear</button></div>
  </div>
  <div class="row">
    <button id="btnGarage" style="flex:1">🚗 Garage</button>
    <button id="btnChest" style="flex:1">🎁 Chest (<span id="chestN">0</span>)</button>
  </div>
  <div class="row">
    <button id="btnSound" style="flex:1">🔊</button>
    <button id="btnSteer" style="flex:1">Steer: Normal</button>
    <button id="btnFx" style="flex:1">FX: On</button>
  </div>
  <div class="statsLine" id="statsLine"></div>
  <div class="statsLine" style="color:#7fae8a;margin-top:1px" id="ctrlHelp"></div>
</div>

<div id="garage" class="panel hidden">
  <h3 id="garageTitle">🚗 Garage &amp; Style</h3>
  <div class="tabs">
    <button data-tab="cars" class="on">Cars</button>
    <button data-tab="paint">Paint</button>
    <button data-tab="style">Style</button>
    <button data-tab="ach">🏆 Awards</button>
  </div>
  <div class="scrollBox" id="garageBox"></div>
  <div class="statsLine" id="garageInfo"></div>
  <button id="btnGarageBack">Back</button>
</div>

<div id="results" class="panel hidden">
  <div class="logo" style="font-size:18px" id="resTitle">FINISH</div>
  <div class="sub" id="resSub"></div>
  <div id="resTable"></div>
  <div class="statsLine" id="resReward"></div>
  <div class="statsLine" id="resExtra" style="color:#ffe082"></div>
  <button class="big" id="btnNext">Race Again</button>
  <div style="display:flex;gap:4px">
    <button id="btnResMenu">Menu</button>
    <button id="btnResGarage">🚗 Garage</button>
  </div>
</div>

<div id="pauseMenu" class="panel hidden" style="justify-content:center;overflow-y:auto">
  <h3>Paused</h3>
  <button class="big" id="btnResume">Resume</button>
  <button id="btnRestart">Restart Race (R)</button>
  <div class="sec">Settings</div>
  <button id="btnSens">🎡 Steering Sens: Normal</button>
  <button id="btnFlip">Wheel Flip: OFF</button>
  <button id="btnTimes">🏆 Leaderboard Times</button>
  <button id="btnQuit">Quit to Menu</button>
</div>

<div id="leaderboard" class="panel hidden">
  <h3>🏆 Leaderboard Times</h3>
  <div class="scrollBox" id="lbBox"></div>
  <div class="statsLine">Best race time &amp; best lap per track</div>
  <button id="btnLbBack">Back</button>
</div>

<script>
(function(){
'use strict';
const W=240,H=282;
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
function fmt(t){ if(!isFinite(t)) return '--:--.--'; const m=Math.floor(t/60), s=t-m*60; return (m>0? m+':' : '') + (s<10&&m>0?'0':'') + s.toFixed(2); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dateHash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return Math.abs(h); }

/* ---------- persistent data (v2 keys kept, v3 keys added) ---------- */
function loadJSON(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
let bestTimes=loadJSON('r1racer_bestTimes',{});
let bestLaps=loadJSON('r1racer_bestLaps',{});
let ghosts=loadJSON('r1racer_ghosts',{});
let stats=loadJSON('r1racer_stats',{races:0,wins:0,podiums:0,drifts:0,boosts:0,coinsEarned:0,tracksRaced:{},cupsWon:0,chestsOpened:0});
let coins=loadJSON('r1racer_coins',0);
let chests=loadJSON('r1racer_chests', null);
if(chests===null){ chests=parseInt(localStorage.getItem('chestCount')||'0',10)||0; }
let ownedCars=loadJSON('ownedCars',[]);
if(!ownedCars.length) ownedCars=['Red Starter'];
let selectedCar=localStorage.getItem('selectedCar')||'Blue Bolt';
if(ownedCars.indexOf(selectedCar)<0) selectedCar=ownedCars[0];
let soundOn=loadJSON('r1racer_sound',true);
let xp=loadJSON('r1racer_xp',0);
let pity=loadJSON('r1racer_pity',{epic:0,leg:0});
let ownedCos=loadJSON('r1racer_ownedCos',['paint-stock','livery-none','trail-smoke','wheels-stock','horn-classic']);
let custom=loadJSON('r1racer_custom',{paint:'paint-stock',livery:'livery-none',trail:'trail-smoke',wheels:'wheels-stock',horn:'horn-classic'});
let unlockedTracks=loadJSON('r1racer_unlockedTracks',['Oval','Square','City','Harbor']);
let cupBest=loadJSON('r1racer_cupBest',{});
let medals=loadJSON('r1racer_medals',{});
let achDone=loadJSON('r1racer_ach',[]);
let daily=loadJSON('r1racer_daily',{lastClaim:'',lastPlayed:''});
let settings=loadJSON('r1racer_settings',{steer:1,fx:true}); // steer: 0 Smooth 1 Normal 2 Sharp
function levelOf(x){ return Math.floor(Math.sqrt(x/60))+1; }
function xpForLevel(l){ return 60*(l-1)*(l-1); }

/* ---------- audio ---------- */
let AC=null, engOsc=null, engGain=null, engFilter=null, noiseGain=null, windGain=null;
function audioInit(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    engOsc=AC.createOscillator(); engOsc.type='sawtooth'; engOsc.frequency.value=55;
    engFilter=AC.createBiquadFilter(); engFilter.type='lowpass'; engFilter.frequency.value=420; engFilter.Q.value=2;
    engGain=AC.createGain(); engGain.gain.value=0;
    engOsc.connect(engFilter); engFilter.connect(engGain); engGain.connect(AC.destination); engOsc.start();
    const len=AC.sampleRate*1, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    const nf=AC.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=900;
    noiseGain=AC.createGain(); noiseGain.gain.value=0;
    src.connect(nf); nf.connect(noiseGain); noiseGain.connect(AC.destination);
    const wf=AC.createBiquadFilter(); wf.type='lowpass'; wf.frequency.value=480;
    windGain=AC.createGain(); windGain.gain.value=0;
    src.connect(wf); wf.connect(windGain); windGain.connect(AC.destination); src.start();
  }catch(e){ AC=null; }
}
function beep(f,dur,g,type,when){
  if(!AC||!soundOn) return; const t0=AC.currentTime+(when||0);
  const o=AC.createOscillator(), gn=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
  gn.gain.setValueAtTime(0.0001,t0); gn.gain.linearRampToValueAtTime(g||0.07,t0+0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn); gn.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.05);
}
function jingle(win){ if(!AC) return; const n=win?[523,659,784,1046]:[392,330,262]; n.forEach((f,i)=>beep(f,0.22,0.08,'square',i*0.13)); }
function engine(speedRatio,drifting,throttleOn){
  if(!AC) return;
  const on = soundOn && (phase==='race'||phase==='countdown');
  engGain.gain.setTargetAtTime(on ? 0.015 + speedRatio*0.05 + (throttleOn?0.012:0) : 0, AC.currentTime, 0.06);
  engOsc.frequency.setTargetAtTime(50 + speedRatio*165 + (drifting?18:0), AC.currentTime, 0.05);
  engFilter.frequency.setTargetAtTime(300 + speedRatio*900, AC.currentTime, 0.08);
  noiseGain.gain.setTargetAtTime(on && drifting ? 0.05 : 0, AC.currentTime, 0.05);
  if(windGain) windGain.gain.setTargetAtTime(on ? clamp(speedRatio-0.55,0,0.45)*0.11 : 0, AC.currentTime, 0.12);
}
function thud(v){
  if(!AC||!soundOn) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(38,t+0.13);
    g.gain.setValueAtTime(clamp(v,0.02,0.2),t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.16);
  }catch(e){}
}
const HORNS={
 'horn-classic':()=>{ beep(440,0.16,0.09); beep(554,0.16,0.07,'square',0.0); },
 'horn-truck':()=>{ beep(174,0.4,0.12,'sawtooth'); beep(220,0.4,0.09,'sawtooth'); },
 'horn-clown':()=>{ beep(880,0.09,0.08); beep(1174,0.14,0.08,'square',0.1); },
 'horn-8bit':()=>{ [660,880,990,1320].forEach((f,i)=>beep(f,0.07,0.07,'square',i*0.07)); },
 'horn-laser':()=>{ if(AC&&soundOn){ const o=AC.createOscillator(),g=AC.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(1400,AC.currentTime); o.frequency.exponentialRampToValueAtTime(120,AC.currentTime+0.3); g.gain.setValueAtTime(0.08,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.3); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+0.32);} }
};
function playHorn(id){ audioInit(); const h=HORNS[id||custom.horn]; if(h) h(); }

/* ---------- cars ---------- */
const CAR_POOL=[
 {id:'rookie-red',rarity:'common',color:'#e63a3a',name:'Red Starter'},
 {id:'blue-bolt',rarity:'common',color:'#3766ff',name:'Blue Bolt'},
 {id:'asphalt-ankle',rarity:'common',color:'#5a5a5a',name:'Asphalt Ankle'},
 {id:'citrus-nitro',rarity:'rare',color:'#ff9f1c',name:'Citrus Nitro'},
 {id:'mint-fang',rarity:'rare',color:'#2ec4b6',name:'Mint Fang'},
 {id:'hellfire-v8',rarity:'rare',color:'#ff4500',name:'Hellfire V8'},
 {id:'bullet-sprite',rarity:'rare',color:'#ff1493',name:'Bullet Sprite'},
 {id:'toxic-wasp',rarity:'rare',color:'#aeea00',name:'Toxic Wasp'},
 {id:'phoenix-vant',rarity:'epic',color:'#ff7bff',name:'Phoenix Vant'},
 {id:'ocean-drift',rarity:'epic',color:'#00d0ff',name:'Ocean Drift'},
 {id:'stormbreaker',rarity:'epic',color:'#9400d3',name:'Stormbreaker'},
 {id:'cobrafang-s',rarity:'epic',color:'#32cd32',name:'Cobra Fang'},
 {id:'solar-flare',rarity:'epic',color:'#ffea00',name:'Solar Flare'},
 {id:'golden-mirage',rarity:'legendary',color:'#ffcc00',name:'Golden Mirage'},
 {id:'shadow-wraith',rarity:'legendary',color:'#8b5cf6',name:'Shadow Wraith'},
 {id:'volcanic-valkyrie',rarity:'legendary',color:'#ff0040',name:'Volcanic Valkyrie'},
 {id:'neon-reaper',rarity:'legendary',color:'#00e676',name:'Neon Reaper'},
 {id:'orion-marshal',rarity:'legendary',color:'#00bfff',name:'Orion Marshal'},
 {id:'aurora-phantom',rarity:'mythic',color:'#7affd4',name:'Aurora Phantom'},
 {id:'void-runner',rarity:'mythic',color:'#b388ff',name:'Void Runner'}
];
const RARITY_STAT={common:{spd:1.00,acc:1.00,grp:1.00},rare:{spd:1.03,acc:1.03,grp:1.02},epic:{spd:1.06,acc:1.05,grp:1.04},legendary:{spd:1.09,acc:1.08,grp:1.06},mythic:{spd:1.12,acc:1.11,grp:1.08}};
const RARITY_RANK={common:0,rare:1,epic:2,legendary:3,mythic:4};
function carByName(n){ for(const c of CAR_POOL) if(c.name===n) return c; return CAR_POOL[0]; }
function carById(id){ for(const c of CAR_POOL) if(c.id===id) return c; return CAR_POOL[0]; }
function carStats(c){
  const base=RARITY_STAT[c.rarity]; const h=mulberry(c.id.length*7919+c.id.charCodeAt(0)*131)();
  return {spd:base.spd+(h-0.5)*0.012, acc:base.acc+((h*7)%1-0.5)*0.012, grp:base.grp+((h*13)%1-0.5)*0.012};
}

/* ---------- cosmetics (RNG unlockables) ---------- */
const COSMETICS=[
 // paints (override body color)
 {id:'paint-stock',kind:'paint',rarity:'common',name:'Factory Paint',color:null},
 {id:'paint-candy',kind:'paint',rarity:'rare',name:'Candy Apple',color:'#ff1744'},
 {id:'paint-midnight',kind:'paint',rarity:'rare',name:'Midnight Blue',color:'#1a237e'},
 {id:'paint-lime',kind:'paint',rarity:'rare',name:'Acid Lime',color:'#76ff03'},
 {id:'paint-bubblegum',kind:'paint',rarity:'epic',name:'Bubblegum',color:'#ff80ab'},
 {id:'paint-chrome',kind:'paint',rarity:'epic',name:'Liquid Chrome',color:'#cfd8dc'},
 {id:'paint-gold',kind:'paint',rarity:'legendary',name:'24K Gold',color:'#ffd700'},
 {id:'paint-void',kind:'paint',rarity:'legendary',name:'Void Black',color:'#12121a'},

const RARITY_WEIGHT={common:66,rare:22,epic:8,legendary:3,mythic:1};
const CHEST_COST=150;
function rollRarity(forceMin){
  let total=0; for(const k in RARITY_WEIGHT) total+=RARITY_WEIGHT[k];
  let roll=Math.random()*total, rarity='common';
  for(const r of ['common','rare','epic','legendary','mythic']){ roll-=RARITY_WEIGHT[r]; if(roll<=0){ rarity=r; break; } }
  if(forceMin && RARITY_RANK[rarity]<RARITY_RANK[forceMin]) rarity=forceMin;
  return rarity;
}
function openChest(){
  if(chests<=0) return null;
  chests--; stats.chestsOpened++;
  // pity: 8 chests without epic+ forces epic; 25 without legendary+ forces legendary
  let force=null;
  if(pity.leg>=24) force='legendary'; else if(pity.epic>=7) force='epic';
  const wantCar=Math.random()<0.6;
  let result=null;
  const tryPool=(cars)=>{
    const rarity=rollRarity(force);
    const pool=(cars?CAR_POOL:COSMETICS).filter(c=>c.rarity===rarity);
    if(!pool.length) return null;
    const pick=pool[Math.floor(Math.random()*pool.length)];
    return {item:pick, isCar:cars, rarity:rarity};
  };
  result=tryPool(wantCar) || tryPool(!wantCar);
  if(!result) return null;
  const rank=RARITY_RANK[result.rarity];
  pity.epic= rank>=2?0:pity.epic+1;
  pity.leg= rank>=3?0:pity.leg+1;
  let dupe=false, dupeCoins=0;
  if(result.isCar){
    if(ownedCars.indexOf(result.item.name)<0) ownedCars.push(result.item.name); else { dupe=true; dupeCoins=25+rank*25; }
  } else {
    if(ownedCos.indexOf(result.item.id)<0) ownedCos.push(result.item.id); else { dupe=true; dupeCoins=25+rank*25; }
  }
  if(dupe){ coins+=dupeCoins; stats.coinsEarned+=dupeCoins; }
  saveAll();
  return {name:result.item.name, rarity:result.rarity, isCar:result.isCar, kind:result.isCar?'car':result.item.kind, dupe:dupe, dupeCoins:dupeCoins};
}

function catmull(p0,p1,p2,p3,t){ const t2=t*t,t3=t2*t; return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3); }
function buildCenterline(ctrl){
  const out=[]; const N=ctrl.length; const SUB=16;
  for(let i=0;i<N;i++){
    const p0=ctrl[(i-1+N)%N],p1=ctrl[i],p2=ctrl[(i+1)%N],p3=ctrl[(i+2)%N];
    for(let s=0;s<SUB;s++){ const u=s/SUB; out.push({x:catmull(p0[0],p1[0],p2[0],p3[0],u), y:catmull(p0[1],p1[1],p2[1],p3[1],u)}); }

function getTrack(def, reversed){

function renderTrackLayer(tr){

  const g=cv.getContext('2d'); g.translate(-minX,-minY);

      if(nearestIdx(tr,gx,gy,Math.floor(rnd()*tr.count)).dist<halfW+26) continue;

    for(let i=0;i<pts.length;i++){ const p=pts[i]; const ex=p.x+p.nx*s*(halfW-2.5), ey=p.y+p.ny*s*(halfW-2.5); if(i===0) g.moveTo(ex,ey); else g.lineTo(ex,ey); }

  const p0=pts[0];
  g.save(); g.translate(p0.x,p0.y); g.rotate(p0.ang);

  for(let rI=0;rI<2;rI++) for(let cI=-5;cI<5;cI++){ g.fillStyle=(rI+cI)%2===0?'#111':'#f5f5f5'; g.fillRect(rI*sq-3, cI*sq, sq, sq); }

  tr.skidLayer=sk; tr.skidCtx=sk.getContext('2d'); tr.skidCtx.translate(-minX,-minY);

// Scroll wheel steers like an RC-car wheel (nudges a wheel position that auto-centres).

let steerTarget=0, pointerDown=false, pointerStartX=0, pointerId=null;

let throttleOn=true;     // side-button accelerator latch

const SENS_CENTER={Low:0.8,Normal:1.15,High:1.5,Max:1.9};

function sensLevel(){ return settings.sens||'Normal'; }
function ctrlScheme(){ return settings.ctrlScheme||'Wheel'; }
function isWheelScheme(){ const s=ctrlScheme(); return s==='Wheel'||s==='Wheel Inv'; }
function wheelSteer(dir){ // dir: -1 scroll up, +1 scroll down
  let d=dir; if(ctrlScheme()==='Wheel Inv') d=-dir;

}
function onSideButton(){
  audioInit();

  if(phase==='countdown'){ countdownT=Math.min(countdownT,0.55); return; }
  if(phase==='race'){ throttleOn=!throttleOn; toast(throttleOn?'🟢 GAS ON':'⚪ GAS OFF — coasting',700); }
  else if(phase==='paused'){ resumeGame(); }
}
const GEAR_RECT={x:4,y:H-36,w:40,h:32};
const EB_RECT={x:W-102,y:H-36,w:56,h:32};
const BOOST_C={x:W-24,y:H-96,r:16};
function hitRect(e,rc){ return e.clientX>=rc.x && e.clientX<=rc.x+rc.w && e.clientY>=rc.y && e.clientY<=rc.y+rc.h; }
canvas.addEventListener('pointerdown',e=>{
  audioInit();
  if(phase==='countdown'){ countdownT=Math.min(countdownT,0.55); return; }
  if(phase==='race'){
    if(e.clientY<44 && e.clientX>W-52){ pauseGame(); return; }
    if(hitRect(e,GEAR_RECT)){ toggleGear(); return; }
    if(hitRect(e,EB_RECT)){ ebrakeTouch=true; ebrakeId=e.pointerId; return; }
    if(Math.hypot(e.clientX-BOOST_C.x, e.clientY-BOOST_C.y)<BOOST_C.r+7){ tryBoost(player); return; }
  }
  pointerDown=true; pointerId=e.pointerId; pointerStartX=e.clientX;
});
canvas.addEventListener('pointermove',e=>{
  if(!pointerDown||e.pointerId!==pointerId) return;

function endPointer(e){

/* ---------- physics ---------- */
const BASE_MAXV=252, BASE_ACCEL=205;
function tryBoost(r){
  if(!r||r.finished) return;
  if(r.boostCharges>0 && r.boostTime<=0.15){
    r.boostCharges--; r.boostTime=0.85;
    if(r.isPlayer){ stats.boosts++; beep(180,0.28,0.10,'sawtooth'); }
    for(let i=0;i<10;i++) spawnPart(r.x,r.y,'#ffb300',16,(Math.random()-0.5)*60,(Math.random()-0.5)*60);

}
function spawnPart(x,y,c,life,vx,vy,shape){

}
function spawnFloater(x,y,text,color){ floaters.push({x:x,y:y,text:text,color:color||'#ffd54f',life:1.1}); }
function trailFX(r,x,y,baseVx,baseVy){
  const style=cosById(custom.trail).style||'smoke';
  if(!r.isPlayer){ spawnPart(x,y,'rgba(200,200,200,0.8)',18,baseVx,baseVy); return; }
  switch(style){
    case 'fire': spawnPart(x,y,Math.random()<0.5?'#ff6d00':'#ffca28',16,baseVx,baseVy); break;
    case 'ice': spawnPart(x,y,Math.random()<0.5?'#b3e5fc':'#e1f5fe',20,baseVx,baseVy,'diamond'); break;
    case 'stars': spawnPart(x,y,'#fff176',22,baseVx,baseVy,'star'); break;
    case 'bubbles': spawnPart(x,y,'rgba(160,230,255,0.9)',24,baseVx*0.4,baseVy*0.4-14,'bubble'); break;
    case 'glitch': spawnPart(x,y,['#ff1744','#00e5ff','#76ff03','#d500f9'][Math.floor(Math.random()*4)],12,baseVx+(Math.random()-0.5)*36,baseVy+(Math.random()-0.5)*36); break;
    case 'rainbow': spawnPart(x,y,'hsl('+((Date.now()/6)%360)+',95%,62%)',22,baseVx,baseVy); break;
    default: spawnPart(x,y,'rgba(200,200,200,0.8)',18,baseVx,baseVy);
  }
}
function carInput(r,dt){
  if(r.isPlayer){
    let steer=steerTarget;
    if(keys.has('ArrowLeft')||keys.has('a')) steer=-1;
    if(keys.has('ArrowRight')||keys.has('d')) steer=1;
    const gas= throttleOn || pointerDown || keys.has('ArrowUp') || keys.has('w');
    const cosA=Math.cos(r.angle), sinA=Math.sin(r.angle);
    const vfNow=r.vx*cosA+r.vy*sinA;
    let thr=0;
    if(keys.has('ArrowDown')||keys.has('s')) thr= gear==='D'? -0.55 : 0.95;
    else if(gas) thr= gear==='D'? 0.95 : -1;
    else { // coasting with the gas off: gentle engine braking
      if(gear==='D' && vfNow>8) thr=-0.14;
      if(gear==='R' && vfNow<-8) thr=0.14;
    }
    const hb=keys.has('Shift')||ebrakeTouch;
    return {steer:steer,thr:thr,handbrake:hb};
  }
  // --- AI ---
  const pts=track.pts, n=track.count;
  r.linePhase+=dt*0.35;
  const look=8+Math.floor(Math.hypot(r.vx,r.vy)/26);
  const ti=((r.idx+look)%n+n)%n;
  const tp=pts[ti];
  const off=Math.sin(r.linePhase)*13*r.skill;
  const txp=tp.x+tp.nx*off, typ=tp.y+tp.ny*off;
  const ta=Math.atan2(typ-r.y,txp-r.x);

  const fi=((r.idx+look+13)%n+n)%n;
  const bend=Math.abs(angDiff(pts[fi].ang, pts[ti].ang));
  let thr=1;
  if(bend>0.85) thr=0.55; else if(bend>0.5) thr=0.78;
  if(Math.abs(steer)>0.8) thr=Math.min(thr,0.8);
  for(const o of racers){ if(o===r) continue;
    const dx=o.x-r.x, dy=o.y-r.y; const d2=dx*dx+dy*dy;
    if(d2<340){ const ahead=Math.cos(r.angle)*dx+Math.sin(r.angle)*dy; if(ahead>0){ steer+= (Math.sin(r.angle)*dx-Math.cos(r.angle)*dy)>0? -0.35:0.35; thr*=0.92; } }

function stepCar(r,dt){
  if(r.finished){ r.vx*=0.92; r.vy*=0.92; r.x+=r.vx*dt; r.y+=r.vy*dt; return; }
  const inp=carInput(r,dt);
  const cosA=Math.cos(r.angle), sinA=Math.sin(r.angle);
  let vf=r.vx*cosA+r.vy*sinA, vl=-r.vx*sinA+r.vy*cosA;
  const maxV=BASE_MAXV*r.stats.spd;
  let rb=1;
  if(!r.isPlayer && mode!=='Time Trial'){
    const gap=player.prog-r.prog;
    rb=clamp(1+gap*0.000012*(difficulty===0?1.5:difficulty===2?0.55:1.0), difficulty===2?0.97:0.93, difficulty===0?1.05:1.085);
  }

  if(r.isPlayer){
    const rate= inp.thr>(r.thrSm||0)? 4.2 : 14;
    r.thrSm=(r.thrSm||0) + clamp(inp.thr-(r.thrSm||0), -rate*dt, rate*dt);

    }
  } else if(wasDrifting && !r.drifting){

      for(let k=0;k<6+tier*3;k++) spawnPart(r.x,r.y,bc,26,(Math.random()-0.5)*70,(Math.random()-0.5)*70);
      if(r.isPlayer){ stats.drifts++; stats.boosts++; banner(['','⚡ MINI BOOST!','⚡⚡ SUPER BOOST!','🔥 ULTRA BOOST!'][tier],750); beep(440+tier*110,0.16,0.08,'square'); spawnFloater(r.x,r.y-16,['','MINI','SUPER','ULTRA'][tier]+' BOOST',bc); }

function drawSkid(r){
  const g=track.skidCtx; if(!g) return;
  const cosA=Math.cos(r.angle), sinA=Math.sin(r.angle);

  for(const s of [-5,5]){
    const wx=r.x - cosA*8 + (-sinA)*s, wy=r.y - sinA*8 + cosA*s;
    g.beginPath(); g.moveTo(wx - r.vx*0.016, wy - r.vy*0.016); g.lineTo(wx,wy); g.stroke();
  }
}
let thudCD=0;
function collide(){
  for(let i=0;i<racers.length;i++) for(let j=i+1;j<racers.length;j++){
    const a=racers[i], b=racers[j];
    const dx=b.x-a.x, dy=b.y-a.y; const d=Math.hypot(dx,dy);
    if(d>0.01 && d<17){
      const push=(17-d)/2, ux=dx/d, uy=dy/d;
      a.x-=ux*push; a.y-=uy*push; b.x+=ux*push; b.y+=uy*push;
      const relN=(b.vx-a.vx)*ux+(b.vy-a.vy)*uy; // closing speed along the contact normal
      if(relN<0){
        const imp=-(1.35)*relN/2; // restitution bounce, shared between both cars
        a.vx-=imp*ux; a.vy-=imp*uy; b.vx+=imp*ux; b.vy+=imp*uy;
        const tvx=(a.vx+b.vx)/2, tvy=(a.vy+b.vy)/2;
        a.vx=lerp(a.vx,tvx,0.18); a.vy=lerp(a.vy,tvy,0.18); b.vx=lerp(b.vx,tvx,0.18); b.vy=lerp(b.vy,tvy,0.18);
        if(a.isPlayer||b.isPlayer){
          const impact=Math.abs(relN);
          cam.shake=Math.min(6,cam.shake+0.8+impact*0.02);
          if(thudCD<=0 && impact>40){ thud(0.05+impact*0.0006); thudCD=0.12; }
          const nsp= impact>90? 6:3;
          for(let k=0;k<nsp;k++) spawnPart((a.x+b.x)/2,(a.y+b.y)/2,'#FFE082',8,(Math.random()-0.5)*90,(Math.random()-0.5)*90,'star');
        }
      } else {
        const tvx=(a.vx+b.vx)/2, tvy=(a.vy+b.vy)/2;
        a.vx=lerp(a.vx,tvx,0.3); a.vy=lerp(a.vy,tvy,0.3); b.vx=lerp(b.vx,tvx,0.3); b.vy=lerp(b.vy,tvy,0.3);
      }
    }
  }
}
function standings(){
  return racers.slice().sort((a,b)=>{
    const pa=a.finished? (lapCount*track.count + (1e7 - a.finishTime)) : a.prog;
    const pb=b.finished? (lapCount*track.count + (1e7 - b.finishTime)) : b.prog;
    return pb-pa;

}
function finishRace(r){
  r.finished=true; r.finishTime=raceTime;
  if(!r.isPlayer) return;
  phase='results';
  stats.races++;
  const order=standings();
  const pos=order.indexOf(player)+1;
  if(pos===1) stats.wins++;
  if(pos<=3) stats.podiums++;
  const tn=track.def.name;
  if(!bestTimes[tn] || r.finishTime<bestTimes[tn]) bestTimes[tn]=r.finishTime;
  if(player.bestLap<Infinity && (!bestLaps[tn] || player.bestLap<bestLaps[tn])) bestLaps[tn]=player.bestLap;
  let medalNote='';
  if(mode==='Time Trial'){
    if(ghostRec && ghostRec.length>10){
      const prev=ghosts[tn+':'+lapCount];
      if(!prev || r.finishTime<prev.time) ghosts[tn+':'+lapCount]={time:r.finishTime, samples:ghostRec};
    }
    const tg=medalTargets(track.def, lapCount);
    let m=null;
    if(r.finishTime<=tg.gold) m='gold'; else if(r.finishTime<=tg.silver) m='silver'; else if(r.finishTime<=tg.bronze) m='bronze';
    if(m){ const prevM=medals[tn]; const rank={bronze:1,silver:2,gold:3};
      if(!prevM || rank[m]>rank[prevM]){ medals[tn]=m; medalNote='🏅 '+m.toUpperCase()+' medal on '+tn+'!'; } }
  }
  // rewards
  let coinWin=[120,80,55,35,22,14][pos-1]||10, chestWin=0;
  const ptsTable=[10,6,4,3,2,1];
  if(cup){ for(let i=0;i<order.length;i++){ const nm=order[i].name; cup.points[nm]=(cup.points[nm]||0)+ptsTable[i]; } if(pos===1) chestWin=1; }
  else if(pos===1) chestWin=1;
  // XP + level ups
  const xpGain= 40 + [60,45,32,22,15,10][pos-1] + lapCount*4;
  const lvlBefore=levelOf(xp); xp+=xpGain; const lvlAfter=levelOf(xp);
  let levelNote='';
  if(lvlAfter>lvlBefore){ chests+= (lvlAfter-lvlBefore); levelNote='⭐ LEVEL '+lvlAfter+'! +'+(lvlAfter-lvlBefore)+' chest'; }
  coins+=coinWin; stats.coinsEarned+=coinWin; chests+=chestWin;
  // daily reward
  let dailyNote='';

    daily.lastClaim=todayKey();
    coins+=200; stats.coinsEarned+=200; chests+=1;
    dailyNote='📅 Daily complete: +200 coins +1 chest!';

  checkAchievements();

  showResults(pos,coinWin,chestWin,order,{xpGain:xpGain, levelNote:levelNote, medalNote:medalNote, dailyNote:dailyNote});
}

  ctx.font='6.5px sans-serif'; ctx.fillText('HOLD=DRIFT', EB_RECT.x+EB_RECT.w/2, EB_RECT.y+26);
  ctx.textAlign='left';
  // boost button (above the E-brake)
  ctx.beginPath(); ctx.arc(BOOST_C.x,BOOST_C.y,BOOST_C.r,0,7); ctx.fillStyle= player.boostCharges>0? 'rgba(255,160,0,0.9)':'rgba(90,90,90,0.6)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1; ctx.stroke();
  ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.fillText('⚡', BOOST_C.x, BOOST_C.y+5); ctx.textAlign='left';
  ctx.font='bold 8px sans-serif'; ctx.fillStyle='#fff'; ctx.fillText('x'+player.boostCharges, BOOST_C.x-6, BOOST_C.y+25);
  // drift meter (bottom-center)
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(52,H-11,86,5);
  ctx.fillStyle= player.boostTime>0? '#ff8f00' : player.driftCharge>=1.1? '#ff5c8a' : player.driftCharge>=0.75? '#ff9800' : player.driftCharge>=0.4? '#ffee58' : '#78909c';
  const mw= player.boostTime>0? clamp(player.boostTime/1.1,0,1) : clamp(player.driftCharge/1.2,0,1);
  ctx.fillRect(52,H-11,86*mw,5);
  ctx.font='6.5px sans-serif'; ctx.fillStyle='#cfe8d4'; ctx.fillText(player.boostTime>0?'BOOST':'DRIFT', 52, H-13);
  // speed + gas state (right column, above the E-brake)
  const kmh=Math.round(Math.hypot(player.vx,player.vy)*0.62);
  ctx.textAlign='right';
  ctx.font='bold 7.5px sans-serif'; ctx.fillStyle= throttleOn? '#69f0ae':'#9e9e9e';
  ctx.fillText(throttleOn?'● GAS ON':'○ GAS OFF', W-6, H-58);
  ctx.font='900 13px sans-serif'; ctx.fillStyle='#fff'; ctx.fillText(kmh+'', W-6, H-44);
  ctx.font='7px sans-serif'; ctx.fillStyle='#9fd8ae'; ctx.fillText('km/h', W-6, H-33);
  ctx.textAlign='left';
  if(wrongWayT>0.7){ ctx.font='900 13px sans-serif'; ctx.fillStyle='#ff5252'; ctx.textAlign='center'; ctx.fillText('⚠ WRONG WAY ⚠', W/2, 44); ctx.textAlign='left'; }
  else if(player.zone==='oil'){ ctx.font='bold 8px sans-serif'; ctx.fillStyle='#90caf9'; ctx.textAlign='center'; ctx.fillText('🛢 OIL SLICK!', W/2, 36); ctx.textAlign='left'; }
  else if(player.zone==='ice'){ ctx.font='bold 8px sans-serif'; ctx.fillStyle='#b3e5fc'; ctx.textAlign='center'; ctx.fillText('🧊 ICE!', W/2, 36); ctx.textAlign='left'; }
  else if(player.offroad){ ctx.font='bold 8px sans-serif'; ctx.fillStyle='#ffab91'; ctx.textAlign='center'; ctx.fillText('OFF ROAD', W/2, 36); ctx.textAlign='left'; }
  if(player.drafting){ ctx.font='bold 8px sans-serif'; ctx.fillStyle='#7FE7F2'; ctx.textAlign='center'; ctx.fillText('💨 SLIPSTREAM', W/2, 52); ctx.textAlign='left'; }
}
function drawMinimap(order){
  const pts=track.pts; const S=0.088, ox=W-58, oy=32;
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(ox-4,oy-4,58,58);
  ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=2; ctx.beginPath();
  for(let i=0;i<pts.length;i+=3){ const p=pts[i]; const mx=ox+29+p.x*S, my=oy+29+p.y*S; if(i===0) ctx.moveTo(mx,my); else ctx.lineTo(mx,my); }
  ctx.closePath(); ctx.stroke();
  for(const gf of gifts){ ctx.fillStyle='#ff4081'; ctx.fillRect(ox+28+gf.x*S, oy+28+gf.y*S, 3,3); }
  for(const r of order){ ctx.fillStyle=r.isPlayer?'#ffd54f':r.color; ctx.beginPath(); ctx.arc(ox+29+r.x*S, oy+29+r.y*S, r.isPlayer?3:2.2, 0, 7); ctx.fill(); }
}
/* ---------- main loop ---------- */
function update(dt){
  if(phase==='countdown'){
    countdownT-=dt;
    if(countdownT<=0.55 && countdownT+dt>0.55) beep(880,0.3,0.11);
    else if(Math.ceil(countdownT-0.6)!==Math.ceil(countdownT+dt-0.6) && countdownT>0.6) beep(440,0.12,0.09);
    if(countdownT<=0){ phase='race'; banner('GO!',600); }
    engine(0,false,false);
    return;
  }
  if(phase!=='race') return;
  raceTime+=dt;
  for(const pad of track.pads) if(pad.cd>0) pad.cd-=dt;
  const sub=2, sdt=dt/sub;
  for(let s=0;s<sub;s++){ for(const r of racers) stepCar(r,sdt); collide(); }
  // scroll-wheel steering auto-centres like an RC wheel while racing
  if(isWheelScheme() && !pointerDown){
    const c=(SENS_CENTER[sensLevel()]||1.15)*dt;
    steerTarget= Math.abs(steerTarget)<=c? 0 : steerTarget - Math.sign(steerTarget)*c;
  }
  if(thudCD>0) thudCD-=dt;
  const pSpd2=Math.hypot(player.vx,player.vy);
  if(player.offroad && pSpd2>70) cam.shake=Math.max(cam.shake,0.8); // offroad rumble
  if(pSpd2>218 && Math.random()<0.5) spawnPart(player.x+(Math.random()-0.5)*140, player.y+(Math.random()-0.5)*140, 'rgba(255,255,255,0.65)', 6, -player.vx*0.85, -player.vy*0.85, 'sq'); // speed streaks
  if(player.drafting && Math.random()<0.7) spawnPart(player.x+(Math.random()-0.5)*24, player.y+(Math.random()-0.5)*24, '#B3E5FC', 7, -player.vx*0.4, -player.vy*0.4, 'sq'); // draft wisps
  // gift spawner: keep up to 2 gifts on track ahead of the player
  giftTimer-=dt;
  if(giftTimer<=0){
    giftTimer=4+Math.random()*3;
    if(gifts.length<2){
      const ahead=((player.idx+40+Math.floor(Math.random()*60))%track.count+track.count)%track.count;
      const p=track.pts[ahead]; const off=(Math.random()-0.5)*track.halfW*1.1;
      gifts.push({x:p.x+p.nx*off, y:p.y+p.ny*off});
    }
  }
  // overtake horn + position tracking
  const posNow=standings().indexOf(player)+1;
  if(posNow<prevPlayerPos){ if(hornCD<=0){ playHorn(); hornCD=6; } }
  prevPlayerPos=posNow;
  if(hornCD>0) hornCD-=dt;
  // wrong way: progress shrinking while moving
  if(Math.hypot(player.vx,player.vy)>50){
    const pd=player.prog-(update._lp||player.prog);
    if(pd<-2.2) wrongWayT+=dt; else wrongWayT=Math.max(0,wrongWayT-dt*2);
  }
  update._lp=player.prog;
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94; p.life-=dt*46; if(p.life<=0) parts.splice(i,1); }
  for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.y-=16*dt; f.life-=dt; if(f.life<=0) floaters.splice(i,1); }
  if(ghostRec){ ghostTimer+=dt; if(ghostTimer>=0.1){ ghostTimer=0; ghostRec.push([Math.round(player.x),Math.round(player.y),Math.round(player.angle*100)/100]); } }
  const spdR=clamp(Math.hypot(player.vx,player.vy)/300,0,1);
  engine(spdR, player.drifting, true);
}
let lastNow=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-lastNow)/1000; lastNow=now;
  if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  if(phase==='race'||phase==='countdown') update(dt);
  if(phase!=='menu') render();
}
requestAnimationFrame(frame);
